th.jp/kuronekowiz/article/show/29851","https://blog-imgs-96-origin.fc2.com/o/s/h/oshigotomoney/Screenshot_20160517-150409.png","SS1 保護 Chain；SS2 解答時間停止。","EX-AS 兼具減傷、阻隔，適合穩定周回。","沒有可靠的解題輔助卡時，可以很早培養；一般 SS 模式更值得先試。","日版技能可能有更後段進化；台版要核對你的進化狀態。"],["烏麗希拉","水／火","精靈強化／EX 生存","新手優先練","持續回復和減傷能顯著提高生存能力；EX-AS 的融合效果在混屬隊也能發揮。","1張","https://gamewith.jp/kuronekowiz/article/show/29857","","精靈強化：持續回復、減傷，SS2 另有攻擊增益。","後續進化的融合特殊變化，依隊伍屬性數取得不同輔助。","純粹缺穩定補師或減傷時，先練這張比再練一名老輸出實際。","精靈強化期間本人行動受限；EX-AS 要看台版是否已有對應進化。"],["露露貝爾（小／大）","火／闇","阻隔傷害／反轉強化・邪","條件式實用","小型偏長效阻隔與回復；大型偏複闇隊反轉強化，兩型靠交互進化切換。","1張","https://gamewith.jp/kuronekowiz/article/show/29848","","小型：長回合阻隔；大型：反轉強化・邪等（以已開放進化為準）。","小型偏輔助，大型有貫穿等攻擊向設定。","缺防禦時先看小型；有火闇反轉隊才需要大型。","同一張交互進化原卡，不用額外收集兩張才能切換。"],["蜜亞","純火","特殊盤面／加 Chain","可留待用","受詛咒或異常狀態時的特殊盤面加 Chain 有亮點，沒有相應關卡時使用率有限。","1張","https://gamewith.jp/kuronekowiz/article/show/29860","https://img.gamewith.jp/img/44e98439a3b2e7f2950d62b62381ab6b.jpg","特殊盤面變換，依條件增加 Chain 和攻擊效果。","全體化輸出。","新手有更好盤面與加 C 就不用搶練。","不要只看較新進化的效果值，先確認台版版本。"],["伊迪絲","雷／火","特殊大魔術／EX 功能","先保留","部分敵方機制可能用得到，當通用輸出不一定比後期同類角色好。","1張","https://gamewith.jp/kuronekowiz/article/show/29860","","舊式特殊大魔術，進化後可能調整技能形態。","視進化具有 Chain 或反擊相關輔助。","先放著，缺對策時再培養。","不要與後來女學院系列同名伊迪絲混用。"],["克魯斯","火／雷","斬擊／Chain 與攻擊","隊伍成形再練","對高 C 輸出隊有幫助，但必須考慮累積 Chain 和所需回合。","1張","https://gamewith.jp/kuronekowiz/article/show/29860","https://img.gamewith.jp/img/8c093699dbdc9d894a01fb8497205163.jpg","斬擊大魔術與連鎖增幅。","高 Chain 輸出或相關強化。","已經有穩定加 C 和輸出隊再練。","高 C 需求可能讓初期周回不便。"]],"art":"https://img.gamewith.jp/article/thumbnail/rectangle_l/29860.png","release":"2016-10-01","dateVerified":false,"alias":"","extraNote":"","headerImage":"","headerCaption":""},{"id":"pic2019","name":"神都匹卡雷斯克（初代）","sub":"台版 2019／與機械與少女Ⅱ同檔","summary":"這個 2019 年推出的系列，跟 2020 年《黑貓的魔術師》不同。大多屬早期機制，但菲歐爾的 AS 特殊變化、迦斯帕的雙重技能和桃花的技能充填盤面，仍有對策用途。","focus":"新帳號可先查看桃花能否幫純火隊加速，以及菲歐爾配合時間停止的效果；缺少特殊技能時迦斯帕也值得保留。","stop":"一般各留 1 張。回饋選卡、常駐混池和限定取得方式要分開，不能假設七張都是同一個限定轉蛋直接抽到。","source":"https://forum.gamer.com.tw/G2.php?bsn=25730&lorder=37&parent=6230&sn=3041","cards":[["埃雅露姆","火／雷","詠唱大魔術","後順位培養","要在短時間內正確回答多題，才能打出較高傷害；現代周回多半有操作更少的選擇。","1張","https://gamewith.jp/kuronekowiz/article/show/119419","","詠唱大魔術。","依台版進化而定。","新帳號先不急著練。","控制答題時間是重要成本。"],["菲歐爾","水／火","AS 特殊變化","特殊對策可先練","根據答題速度給予回復、減傷和攻擊強化，若有時間停止技能，能更穩定吃滿效果。","1張","https://gamewith.jp/kuronekowiz/article/show/119418","","AS 特殊變化，依答題時間附加增益。","依後續進化。","有時間停止隊友時可以優先培養。","答題過慢或未達 Excellent 條件會影響收益。"],["歐魯特斯","雷／火","複屬強化／Boost","有替代可放","早期複屬傷害支援與 Boost，需要雷火隊員才能發揮，泛用性較低。","1張","https://gamewith.jp/kuronekowiz/article/show/119420","","複屬性強化與 Boost。","依後續進化。","新帳號不必先練。","Boost 使用時需留意 HP 消耗等限制。"],["桃花（初代）","純火","純火盤面／技能充填","純火隊可先練","為純火隊提供附帶技能充填的盤面，有利於更早施放隊伍的攻擊 SS。","1張","https://gamewith.jp/kuronekowiz/article/show/119423","","特殊盤面變換，純火隊伍可享有較高的技能充填效果。","依後續進化。","有純火隊且缺技能加速時很值得先養。","這張不是 2020 黑貓的魔術師版本的桃花。"],["迦斯帕（初代）","純水","雙重技能賦予","特殊循環可先練","雙重技能在激化、捕食或其他 SS 攻擊循環裡可能有用；組錯隊時效果有限。","1張","https://gamewith.jp/kuronekowiz/article/show/119422","","雙重技能賦予。","依後續進化。","有主力 SS 炸卡時可評估。","與 2020 版迦斯帕的蓄積聖強化不同。"],["凱涅斯（初代）","純雷","40C／斬擊大魔術","純雷高 C 隊可練","斬擊與 40C 高傷打手，在長回合關卡可以持續輸出。","1張","https://gamewith.jp/kuronekowiz/article/show/119421","","斬擊大魔術，可逐步累積 Chain。","高 Chain 打手。","已有純雷強化與加 C 隊伍再培養。","與 2020 雷水版凱涅斯不同。"],["薇基","水／雷","複屬支援","先保留","屬於早期台版同檔角色，完整技能在目前來源中不足以直接判定新手必練。","1張","https://forum.gamer.com.tw/C.php?bsn=25730&snA=13899","","待核對原卡同版 SS。","待核對。","先保留一張，暫不投入大量資源。","本頁先列入台版同檔角色，與 888 名單是否重疊仍未確認。"]],"art":"","release":"2019-04-01","dateVerified":false,"alias":"","extraNote":"","headerImage":"","headerCaption":""},{"id":"pic1","name":"神都匹卡雷斯克","sub":"黑貓的魔術師／台版 2020 年","summary":"這裡選的是台版《神都匹卡雷斯克 黑貓的魔術師》這一池，與其他《神都》年份分開。六張功能差很多，優先度完全取決於你缺界王、回復增益還是控血輸出。","focus":"莉莉亞可補水火界王、迦斯帕能提供回復累積增益、凱涅斯的斬擊加 C 適合成型隊。","stop":"建議各留 1 張。單有一張老式高輸出不足以組完整體系；若缺少關鍵隊友，不必立刻練。","source":"https://www.3loumao.org/2012.html","cards":[["凱涅斯","雷／水","斬擊大魔術／高 C","組隊成形再練","能一次拉高 Chain，對雷水體系的高 C 輸出有明確用途。","1張","https://www.3loumao.org/2012.html","","斬擊大魔術兼加 Chain。","答題條件後 AS 連續化。","已經有雷水輸出與補師時可優先補起來。","大量加 C 可能觸發特定敵人怒條件。"],["迦斯帕","水／光","蓄積解放強化・聖","輔助可先練","長回合打手容易因增益被清掉而掉傷；這張能用累積回復來供給增傷。","1張","https://www.3loumao.org/2012.html","","根據累積回復量提高隊伍傷害。","減傷、阻隔傷害等偏向續航。","缺水光／融合隊增益時可以先養。","要有足夠回復量才能較快到達增益上限。"],["桃花","純火","不調純屬大魔術","特殊關卡備用","控血至低 HP 才能打出預期傷害，不能把她當作開場隨便施放的普攻炸。","1張","https://www.3loumao.org/2012.html","","不調條件下威力較強的純屬大魔術。","依後續進化而定。","需要處理單色且可控血的關卡才投資。","操作失誤可能讓隊伍被敵人補刀。"],["根津千優","雷／闇","反動大魔術・蝕","專門對策","能處理特定敵人防禦與輸出需求，代價是可能承受技能限制。","1張","https://www.3loumao.org/2012.html","","反動大魔術・蝕。","依後續進化而定。","一般新帳號可以先放著，打特殊關再調出來。","使用前務必看反動附帶的封印或其他代價。"],["今久留主好介","火／雷","決鬥／生存控制","特殊關卡備用","決鬥系技能能重新分配敵人攻擊目標，特定高難度會很有價值。","1張","https://www.3loumao.org/2012.html","","決鬥類特殊技能。","視後續進化而定。","如果隊伍缺決鬥對策可保留培養。","並非一般火雷輸出的萬用替代品。"],["莉莉亞","水／火","AS 倍率強化／界王","有水火隊就先練","水火隊有一組可用高連擊與補師時，界王是讓整隊輸出一起提高的關鍵。","1張","https://www.3loumao.org/2012.html","","AS 倍率強化，主要提高隊友 AS 輸出。","依後續進化而定。","如果你有四張能搭配的水火卡，這張培養優先度可提高。","卡片可用但缺水火隊友時，不必硬塞進雜色隊。"]],"art":"","release":"2020-10-01","dateVerified":false,"alias":"","extraNote":"","headerImage":"","headerCaption":""},{"id":"mare4","name":"黃昏無夢者 IV","sub":"黃昏無夢者 4／台版限定","summary":"六張卡以各式輸出與隊伍輔助為主。後續進化後，有些角色從當年主力打手變成特定體系的備用角色。","focus":"莉菲爾偏保護與續航，雷吉適合水火／火水類型的盤面與隊伍協作；傑拉德＆蔻比修負責加 Chain。","stop":"一般各留 1 張，有後續強化的再檢查是否值得培養。新手不用只看當年的高分追練所有打手。","source":"https://gamewith.jp/kuronekowiz/article/show/99308","cards":[["蜜莉","純火","激化／高傷害輸出","有條件練","輸出上限取決於使用回合和技能增幅；在短關卡的實際價值通常不如能即刻開火的新打手。","1張","https://gamewith.jp/kuronekowiz/article/show/99289","https://img.gamewith.jp/article/thumbnail/rectangle/99289.png","激化類攻擊 SS，重複施放逐步提高。","依進化有不同輸出方向。","需要長關卡火力時再練。","面對 SS 耐性或技能反射要先看對策。"],["雷吉","火／水","統一盤面／攻擊支援","水火或火水隊可練","盤面增益在成型隊能改善技能循環，缺同屬隊友時就沒那麼突出。","1張","https://gamewith.jp/kuronekowiz/article/show/99291","https://img.gamewith.jp/article/thumbnail/rectangle/99291.png","統一特殊盤面變換。","連擊／Chain 等輔助。","已有火水隊核心再練。","需看你這張卡當前進化的盤面條件。"],["拉吉特","水／闇","蓄積邪攻擊","備用輸出","適合配合我方受到傷害或異常的蓄積條件爆發，平常周回未必方便。","1張","https://gamewith.jp/kuronekowiz/article/show/99308","","蓄積解放大魔術・邪。","依後續進化而定。","缺水闇打手才練。","蓄積方式須先滿足，別當成開場固定高火力。"],["瑠璃揚羽","純水","特殊大魔術／純屬輸出","有替代品可先放","老式輸出在目前很容易被較新的輸出取代；少數有特定機制的關卡仍可能使用。","1張","https://gamewith.jp/kuronekowiz/article/show/99308","","依版本為純水系攻擊技能。","依後續進化。","有完整純水強化可嘗試。","同角色黃昏 I～IV 的卡圖和技能都不同。"],["傑拉德＆蔻比修","雷／闇","斬擊大魔術／加 C","高 C 隊才練","能為某些 Chain 條件打手準備大量 Chain。","1張","https://gamewith.jp/kuronekowiz/article/show/99308","","斬擊大魔術兼加 Chain。","依後續進化。","手上有要吃 40C 的雷闇隊伍才養。","對低 C 或 EX-AS 自動周回未必是最佳解。"],["莉菲爾","雷／光","蓄積聖／回復減傷","可先練","回復與減傷系 EX-AS 在新手通關時很可靠，SS 則要搭配蓄積條件。","1張","https://gamewith.jp/kuronekowiz/article/show/99308","","蓄積解放大魔術・聖。","後續進化的回復、減傷，適合維持生存。","缺雷光補師或 EX-AS 生存角時值得先試。","使用的 L 版本請先核對台版是否已開放。"]],"art":"https://img.gamewith.jp/article/thumbnail/rectangle_l/99308.png","release":"2018-12-01","dateVerified":false,"alias":"","extraNote":"","headerImage":"","headerCaption":""},{"id":"cross1","name":"響命 CrossDerive","sub":"響命 CrossDerive 第 1 彈／台版","summary":"早期響命系列的角色彼此功能差異明顯。現在可以先挑出解決隊伍缺口的輔助，舊式攻擊手大多不必全練。","focus":"薇潔塔與密絲媞海德的支援作用較容易讓新帳號受益；艾妮等輸出卡則看現有體系。","stop":"抽到可先各留一張；免費卡池之外不用再為了補全老系列追抽。","source":"https://gamewith.jp/kuronekowiz/article/show/53387","cards":[["艾妮","火／光","光傷輸出","看關卡練","在火光屬性隊伍可以補傷害，但通常不是新手最缺的第一個位置。","1張","https://gamewith.jp/kuronekowiz/article/show/53387","","多回合輸出類 SS。","依進化。","沒有火光輸出時才優先練。","別和後續響命、感謝祭版本的艾妮混在一起。"],["薇潔塔","水／雷","能力強化／回復","新手可先練","她的支援能改善隊伍雙圍和續航，通用性往往比當期老式炸卡好。","1張","https://gamewith.jp/kuronekowiz/article/show/53387","","強化、回復等隊伍支援。","依後續進化。","水雷隊缺補強時很適合先養。","技能數值依台版已開放 L 進化為準。"],["密絲媞海德","雷／光","防禦／特殊輔助","功能卡可留","偏向幫隊伍處理特定敵人機制或生存問題，卡池愈完整越容易找出用途。","1張","https://gamewith.jp/kuronekowiz/article/show/53387","","特殊輔助與防禦。","依後續進化。","缺雷屬輔助可優先確認。","單張輸出並非評價重點。"],["格里特","雷／火","多連擊／攻擊","後順位培養","連擊有處理屏障的價值，但爆發與便利度不一定比後期同類輸出好。","1張","https://gamewith.jp/kuronekowiz/article/show/53387","","連擊型傷害技能。","依後續進化。","新手先練有組隊增益和回復的卡。","如果敵人有多彈式反擊要注意。"],["亞萊娜","火／水","技能輸出／支援","依卡池決定","放到完整的火水體系才比較能顯出效益，缺隊友時可以先保留。","1張","https://gamewith.jp/kuronekowiz/article/show/53387","","火水相關特殊技能。","依後續進化。","手上火水隊較完整再練。","舊式輸出不一定適合現代高難關。"],["雷利修","火／光","特殊攻擊／貫穿","特定關卡備用","依後續強化可能有對策價值，普通周回優先度不高。","1張","https://gamewith.jp/kuronekowiz/article/show/53387","","特殊大魔術等。","依後續進化。","主力隊伍完成後再練。","留意同名 CrossDerive 3 的不同版本。"]],"art":"https://img.gamewith.jp/article/thumbnail/rectangle_l/53387.png","release":"2017-08-01","dateVerified":false,"alias":"","extraNote":"","headerImage":"","headerCaption":""},{"id":"newyear2019","name":"恭賀新禧 2019","sub":"台版 2019 年新年轉蛋","summary":"本篇依台版當時實際稱呼的《恭賀新禧 2019》整理；它並不等於日版另一套同名年份轉蛋。舊卡中較值得注意的是不容易取代的特殊技能和加 C 配隊。","focus":"卡奴耶、史特莉與萊葛爾＆席菈的技能配置可以先看；其他卡依現有屬性補強。","stop":"整池不值得為收齊而追抽。大多一張足夠，留到合適關卡再練。","source":"https://gamewith.jp/kuronekowiz/article/show/85767","cards":[["齊格","雷／闇","連擊／輸出","後順位培養","依賴 Chain 或指定條件的輸出，現在有更方便打手就先放著。","1張","https://gamewith.jp/kuronekowiz/article/show/85767","","連擊型攻擊。","依進化。","沒有雷闇輸出才考慮。","與其他新年齊格版本分開。"],["萊葛爾＆席菈","水／火","隊伍輔助／盤面","有搭配隊才練","適合已有水火隊伍、希望改善連鎖或盤面的玩家。","1張","https://gamewith.jp/kuronekowiz/article/show/85767","","連鎖或盤面支援。","依後續進化。","完成水火核心後再練。","現代水火 DAS／界王搭配需依實際技能確認。"],["卡奴耶","火／光","特殊傷害／隊伍增益","視功能而定","在指定火光隊有一席之地，但不是隨便放進任何隊伍都能發揮的卡。","1張","https://gamewith.jp/kuronekowiz/article/show/85767","","依後續進化為特定輸出／輔助。","依後續進化。","若恰好缺火光技能可以練。","留意其他周年或感謝季卡奴耶不是同版本。"],["史特莉","純水","純屬強化／技能支援","純水隊可練","如果純水隊少一個增益位置，老卡的支援仍可能比多一張輸出有幫助。","1張","https://gamewith.jp/kuronekowiz/article/show/85767","","純水屬性隊伍相關增益。","依後續進化。","有純水突破／打手時可補練。","需要實際進化版本以確認技能種類。"],["愛＆愛","火／雷","高 C／連擊","隊伍成形再練","具有可愛的人物特色，但以實用性看屬於看隊伍需求才會上場的攻擊手。","1張","https://gamewith.jp/kuronekowiz/article/show/85767","","依進化以攻擊為主。","依後續進化。","不用優先投入經驗素材。","注意愛＆愛不是兩張分開抽的卡。"],["椿＆葉月","雷／火","特殊輸出／輔助","特殊關卡備用","組合卡在特定技能條件下能工作，整體泛用度不必高估。","1張","https://gamewith.jp/kuronekowiz/article/show/85767","","特殊攻擊技能。","依後續進化。","已有固定主力再回頭練。","需確定是本次新年版本。"]],"art":"https://img.gamewith.jp/article/thumbnail/rectangle_l/85767.png","release":"2019-01-01","dateVerified":false,"alias":"","extraNote":"","headerImage":"","headerCaption":""},{"id":"uwg","name":"職・超魔導列傳 終極勞動女孩","sub":"台版 2019 年 12 月／UWG","summary":"這六張還留有不少可用的特殊技能。對新手而言，先把能提高隊伍整體效益的卡練好，再考慮那些需要特定機制才能打滿傷害的輸出卡。","focus":"艾莉絲的無屬性變化、蘇菲的弱體化、蕾娜的盤面爆破，在缺乏相同功能時比較值得培養。","stop":"各留一張。先確認你的主力缺無屬性化、弱體化還是盤面爆破；若都有更好的替代品，這些老卡就不急。","source":"https://forum.gamer.com.tw/C.php?bsn=25730&snA=14184","cards":[["艾莉絲","純水","無屬性變化","功能卡可先練","讓隊友轉為無屬性，可避開某些屬性防禦或盤面問題；但不是所有關卡都適用。","1張","https://gamewith.jp/kuronekowiz/article/show/146625","","無屬性變化，提供傷害及防禦相關增益。","依後續進化。","沒有無屬化對策時可以先練一張。","變成無屬性後，對有利屬性的原有剋屬加成可能不再適用。"],["伊妮亞","火／水","特殊盤面／輔助","看體系而定","能協助盤面或支援隊伍，但仍需核對現行版技能類型。","1張","https://forum.gamer.com.tw/C.php?bsn=25730&snA=14184","","依後續進化的盤面／輔助技能。","依後續進化。","完整隊伍缺盤面支援再養。","與超魔導其他年份伊妮亞不同。"],["蘇菲","水／光","弱體化大魔術","有打手就值得練","替敵人掛上弱體化，可以讓其他攻擊 SS 的傷害提高。很適合爆發隊。","1張","https://forum.gamer.com.tw/C.php?bsn=25730&snA=14184","https://cdn.gamerch.com/contents/wiki/261/entry/DRYR4irg.jpg","弱體化大魔術。","依後續進化。","已經有能無視反射的爆發打手時優先度上升。","弱體化通常需要計算施放和反射時間。"],["蕾娜","純火","問題類型爆破大魔術","有盤面配合可練","轉色盤面越完整，盤面爆破的輸出越好；沒有穩定轉色時不易發揮。","1張","https://gamewith.jp/kuronekowiz/article/show/146628","","問題類型爆破大魔術。","依後續進化。","有全色轉色手時可以當主攻手。","沒有盤面準備就開 SS 可能傷害不如預期。"],["莉露姆","雷／火","L 次數大魔術","循環隊才練","整場進入 L Mode 的次數越多，技能傷害才會顯著提高。","1張","https://gamewith.jp/kuronekowiz/article/show/146627","","依 L Mode 發動次數提升傷害。","依後續進化。","有短 CD 技能循環的隊伍才投資。","短關卡很難疊出高傷害。"],["愛莉葉塔","火／闇","特殊蓄積／攻擊","備用","需要配合技能條件，不一定適合新帳號第一隊。","1張","https://forum.gamer.com.tw/C.php?bsn=25730&snA=14184","","特殊蓄積或爆發攻擊。","依後續進化。","主力隊完成後才練。","同名愛莉葉塔不同年份技能差距大。"]],"art":"https://img.gamewith.jp/article/thumbnail/rectangle_l/146828.png","release":"2019-12-01","dateVerified":false,"alias":"","extraNote":"","headerImage":"","headerCaption":""},{"id":"thanks2019","name":"感謝祭 2019","sub":"台版 2019 感謝祭／非仲夏","summary":"這一池不能和《仲夏感謝季 2019》混為同一套。較實用的輔助包括薩克特的純水強化、琪夏菈的水火盤面，艾妮與雷迪厄斯則分別偏向蓄積聖及斬擊加 Chain。","focus":"新手若有純水或水火隊，先看薩克特、琪夏菈；雷迪厄斯可以幫部分高 C 隊伍，艾妮需要蓄積條件。","stop":"抽到可各留一張；先把可改善整隊的支援練好。現階段沒有必要為老式爆發輸出去追同池。","source":"https://gamewith.jp/kuronekowiz/article/show/101911","cards":[["艾妮","火／光","蓄積聖攻擊","有回復隊再練","需累積全隊回復量才能打出較高傷害，適合穩定補血的火光隊。","1張","https://gamewith.jp/kuronekowiz/article/show/101911","https://i.imgur.com/zYIhlHF.jpg","蓄積解放大魔術・聖。","依後續進化。","有長回合回復隊才先養。","這是「感謝祭 2019」艾妮，不是響命原版。"],["雷迪厄斯","火／闇","一閃斬擊／加 Chain","高 C 隊可練","能以攻擊敵方複數單位的方式一次增加 Chain；有敵方目標限制時要仔細計算。","1張","https://gamewith.jp/kuronekowiz/article/show/101911","https://i.imgur.com/WQYdOju.jpg","一閃斬擊大魔術。","依後續進化。","有高 C 打手時再養。","Chain 過高可能觸發敵方怒。"],["琪夏菈","水／火","水火盤面／攻擊增益","水火隊可先練","能提供固定的水火盤面與增傷，在水火隊缺盤面手時很方便。","1張","https://gamewith.jp/kuronekowiz/article/show/101911","https://i.imgur.com/Xb1rX0b.jpg","水火特殊盤面變換，依隊伍數量增強。","依後續進化。","有水火界王或 DAS 隊時很實用。","要確認當前隊伍是否真的都是水火。"],["薩克特","純水","純屬性強化","新帳號純水隊優先","一張就能把純水隊 HP、攻擊力一起抬高，比只補一個攻擊手更容易讓早期隊伍成形。","1張","https://gamewith.jp/kuronekowiz/article/show/101911","https://i.imgur.com/KvGfXJA.jpg","純屬性強化，按隊伍純水人數給予雙圍。","依後續進化。","純水隊缺增益時可列最優先培養。","不是所有複水隊友都能吃到完整純屬加成。"],["艾法","雷／闇","蓄積邪攻擊","有傷害隊再練","需要累積指定傷害條件來提高單次爆發，前期周回不一定方便。","1張","https://gamewith.jp/kuronekowiz/article/show/101911","https://i.imgur.com/mvIhWLF.jpg","蓄積解放大魔術・邪。","依後續進化。","缺雷闇爆發時才考慮。","古早版本的設定與當前版可能有進化差異。"],["托托","雷／火","激化型連擊／單體輸出","特殊關卡備用","重複使用技能後才有更高傷害，短關卡投入成本偏高。","1張","https://gamewith.jp/kuronekowiz/article/show/101911","https://i.imgur.com/PuUjnOY.jpg","多次施放強化的單體連擊大魔術。","依後續進化。","對特殊單體 Boss 才練。","需要控制技能反射及 CD。"]],"art":"https://img.gamewith.jp/article/thumbnail/rectangle_l/101911.png","release":"2019-04-01","dateVerified":false,"alias":"","extraNote":"","headerImage":"","headerCaption":""},{"id":"fc3","name":"FairyChord3 KnightSider","release":"2021-05-20","dateVerified":true,"source":"https://forum.gamer.com.tw/C.php?bsn=25730&snA=15132","cards":[["KnightSider 拉米斯費蕾絲","雷／火","傷害強化・連","視雷火隊需求","隊友攻擊次數越多，後續的增傷越有感。雷火隊已有多段 AS 時可以帶；開場就想速刷則不一定比直接輸出快。","1 張","https://forum.gamer.com.tw/C.php?bsn=25730&snA=15132","https://img.gamewith.jp/img/74c36327b750f866b4bc80266e35bf2b.png","傷害強化・連","連擊／貫穿","雷火隊有連擊手再練。","長時間戰鬥效果較好，未確認台版是否開放日版後續再進化。","拉米斯費蕾絲其他活動版本參考立繪","12551"],["KnightSider 鶴音理玲","水／火","蓄積 function searchHistoricPool(v){historicNameQuery=String(v||'').trim();render()}
function sortedHistoricPools(){
 const filtered=HISTORIC_POOLS.filter(p=>!historicNameQuery||[p.name,p.alias||'',p.sub||'',p.release||''].join(' ').toLowerCase().includes(historicNameQuery.toLowerCase()));
 if(historicSortMode==='name')return filtered.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant-TW'));
 const dir=historicSortMode==='old'?1:-1;
 return filtered.sort((a,b)=>dir*String(a.release).localeCompare(String(b.release))||a.name.localeCompare(b.name,'zh-Hant-TW'));
}
function historicPoolNav(){
 const entries=sortedHistoricPools();let prevYear='';
 const buttons=entries.map(p=>{
  const y=String(p.release).slice(0,4);
  const heading=historicSortMode==='name'?'':(y!==prevYear?'<h4 class="archive-year-heading">'+y+' 年</h4>':'');prevYear=y;
  return heading+`<button onclick="openArchive('${p.id}')" class="${historicPoolId===p.id?'on':''}"><span>${esc(p.name)}</span><small>${p.dateVerified?p.release+' 台版':'約 '+y+' 年・月份待查'}</small></button>`;
 }).join('');
 return `<nav class="archive-nav"><div class="archive-nav-head"><strong>過往卡池簡評</strong><small>按台版開放時間整理；可切換早期到近期</small></div><div class="archive-controls"><label>排序 <select onchange="setHistoricSort(this.value)"><option value="new" ${historicSortMode==='new'?'selected':''}>台版日期・新到舊</option><option value="old" ${historicSortMode==='old'?'selected':''}>台版日期・舊到新</option><option value="name" ${historicSortMode==='name'?'selected':''}>系列名稱</option></select></label><label>搜尋 <input value="${esc(historicNameQuery)}" placeholder="名稱、年份" onchange="searchHistoricPool(this.value)" aria-label="搜尋卡池"></label></div><div class="archive-nav-list">${buttons||'<p>沒有符合的系列。</p>'}</div></nav>`;
}

function deckCheck(){const list=state.deck.map(x=>ROLES.find(r=>r.id===x)).filter(Boolean),core=state.teamAttr.startsWith('純')?'pure':['火水','水火','雷水'].includes(state.teamAttr)?'king':['火雷','水雷','雷火'].includes(state.teamAttr)?'das':state.teamAttr==='融合'?'fusion':state.teamAttr==='EX-AS'?'ex':'reverse';let notes=[];if(list.length<5)notes.push('目前只有 '+list.length+'/5 個位置，請補齊五個職能。');if(!list.some(x=>x.id===core))notes.push('缺少此體系典型核心「'+ROLES.find(r=>r.id===core).label+'」。');if(!list.some(x=>x.type==='damage'))notes.push('沒有明確輸出職能，可能無法有效擊倒敵人。');if(!list.some(x=>x.type==='survive'))notes.push('缺少回復或防禦，長回合關卡可能不穩定。');if(list.filter(x=>x.type==='core').length>1)notes.push('放入多種不同核心，請確定各核心條件能同時滿足、避免擠掉輸出與生存。');if(state.teamAttr==='融合')notes.push('融合的五屬判定必須用實卡主／複屬性確認，此處僅檢查功能組成。');if(state.teamAttr==='EX-AS')notes.push('全 EX-AS 隊通常不吃大多數普通 SS Buff，此模板只代表分工，非技能可疊加的保證。');const ok=list.length===5&&list.some(x=>x.id===core)&&list.some(x=>x.type==='damage')&&list.some(x=>x.type==='survive');$('deckFeedback').innerHTML=`<div class="feedback ${ok?'good':''}"><strong>${ok?'✓ 基本職能已具備':'尚有可改進之處'}</strong><ul>${(notes.length?notes:['這是一個可繼續研究的起點。下一步請找實際擁有的卡，核對每張卡的圖鑑 No.、屬性、SS／EX-AS、CD 與對象條件。']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="muted small">本工具不會假設虛構職能一定具有某張真實角色的全部效果。</div></div>`}

function battleInitial(){return {stage:1,turn:1,hp:9000,maxhp:9000,chain:0,buff:0,shield:0,skillBuffAt:-5,skillShieldAt:-3,targetStrike:'left',targetHits:'right',enemies:[{id:'left',name:'回復術士',emoji:'💚',hp:30000,max:30000,layers:0},{id:'mid',name:'守護魔導士',emoji:'☠',hp:120000,max:120000,layers:0,angry:false},{id:'right',name:'屏障術士',emoji:'🛡',hp:40000,max:40000,layers:4}],history:['準備進入 R1。請先觀察左敵的回復、中敵的怒條件以及右敵四層屏障。'],ended:false}}

function simSkill(skill){let s=state.sim;if(!s||s.ended)return;if(skill==='buff'){if(s.turn-1-s.skillBuffAt<5){simLog(s,'1P 的增傷仍在冷卻，不能施放。');render();return}s.buff=8;s.skillBuffAt=s.turn-1;simLog(s,'1P：使用攻擊強化（示範增益持續八次答題；再次使用需五次正解）。')}if(skill==='shield'){if(s.turn-1-s.skillShieldAt<3){simLog(s,'5P 減傷尚未準備完成。');render();return}s.shield=3;s.skillShieldAt=s.turn-1;simLog(s,'5P：啟用 30% 減傷（示範持續三次答題，CD 3）。')}render()}
function hitEnemy(s,id,amount){const e=s.enemies.find(x=>x.id===id&&x.hp>0);if(!e){simLog(s,'本次指定的敵人已經死亡，這次目標判定沒有造成傷害。');return}if(e.layers>0){e.layers--;simLog(s,`攻擊 ${e.name}：消去一層多層屏障，剩 ${e.layers} 層。`);return}const blocked=s.stage===1&&e.id==='mid'&&e.angry&&amount<=30000;if(blocked){simLog(s,`${e.name} 的阻隔傷害使這次 ${amount.toLocaleString()} 點傷害無效。`);return}let actual=Math.min(amount,e.hp);e.hp=Math.max(0,e.hp-actual);simLog(s,`擊中 ${e.name}：-${actual.toLocaleString()} HP${e.hp===0?'，已擊倒。':''}`)}
function playBattle(){let s=state.sim;if(!s||s.ended)return;const oldTurn=s.turn;const dmg3=s.buff>0?40000:20000,dmg2=s.buff>0?5000:3000;simLog(s,`── R${s.stage==='boss'?'BOSS':s.stage} T${oldTurn}：答題正確，Chain +1 ──`);
 if(s.stage===1){for(let i=0;i<5;i++)hitEnemy(s,s.targetHits,dmg2);hitEnemy(s,s.targetStrike,dmg3);const e=s.enemies;if(e[1].hp>0&&e[0].hp===0&&e[2].hp===0&&!e[1].angry){e[1].angry=true;simLog(s,'⚠ 中敵達成怒條件：左右兩敵死亡。怒後先制施加「阻隔傷害 30,000」。')}
 // 左敵回滿存活的我方目標；不復活已死亡敵人
 if(e[0].hp>0){for(const a of e)if(a.hp>0)a.hp=a.max;simLog(s,'左敵存活：回復全體存活敵人 HP 至滿。')}
 let damage=(e[1].hp>0?(e[1].angry?4500:2500):0)+(e[2].hp>0?1500:0);if(damage>0){let taken=Math.round(damage*(s.shield>0?.7:1));s.hp-=taken;simLog(s,`敵方造成 ${taken.toLocaleString()} 傷害（減傷狀態${s.shield>0?'有效':'無效'}）。`)}
 }else{const boss=s.enemies[0];for(let i=0;i<5;i++)hitEnemy(s,'boss',dmg2);hitEnemy(s,'boss',dmg3);if(boss.hp>0&&!boss.angry&&boss.hp<75000){boss.angry=true;s.buff=0;simLog(s,'⚠ Boss HP 低於 50%：怒後先制詛咒，清除 1P 的增傷。')}
 if(boss.hp>0){let base=boss.angry?5000:3500;let taken=Math.round(base*(s.shield>0?.7:1));s.hp-=taken;simLog(s,`Boss 普通行動造成 ${taken} 傷害。`)} }
 // 4P AS heal, illustrative heal after enemy phase to keep simple
 if(s.hp>0){const heal=2250;s.hp=Math.min(s.maxhp,s.hp+heal);simLog(s,'4P 回復 AS：回復至多 2,250 HP（教學簡化處理）。')}s.chain++;if(s.buff>0)s.buff--;if(s.shield>0)s.shield--;
 if(s.hp<=0){s.hp=0;s.ended=true;simLog(s,'✖ 隊伍 HP 歸零。回頭檢查擊殺目標、防禦施放時機。')}
 else if(s.enemies.every(e=>e.hp===0)){if(s.stage===1){s.stage='boss';s.enemies=[{id:'boss',name:'封印魔導書',emoji:'📕',hp:150000,max:150000,layers:0,angry:false}];s.targetHits='boss';s.targetStrike='boss';simLog(s,'✓ R1 完成！進入 Boss 戰。Boss 有技能反射與高 SS 耐性（本模擬不提供攻擊 SS）。');s.turn++}else{s.ended=true;simLog(s,`🎉 教學關卡通關，共 ${oldTurn} 次答題！`)} }
 else s.turn++;
 render();const log=$('simLog');if(log)log.scrollTop=log.scrollHeight;
}

function battleView(){if(!state.sim)state.sim=battleInitial();const s=state.sim;
const opts=s.enemies.filter(e=>e.hp>0).map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
let t2=s.targetHits,t3=s.targetStrike; if(!s.enemies.some(e=>e.id===t2&&e.hp>0))t2=s.enemies.find(e=>e.hp>0)?.id||'boss';if(!s.enemies.some(e=>e.id===t3&&e.hp>0))t3=s.enemies.find(e=>e.hp>0)?.id||'boss';s.targetHits=t2;s.targetStrike=t3;
return `<div class="panel"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><div class="kicker">BATTLE SIMULATOR · 教學簡化模型</div><h2 style="margin:8px 0">被封印的魔導書</h2><p class="muted small">練習：先殺左敵回復術士，用五連擊拆右敵屏障，控制中敵怒；Boss 怒後重新施放增傷。</p></div><button class="btn secondary" onclick="beginBattle()">↺ 重開關卡</button></div><div class="alert">這是<strong>自製教學沙盒</strong>，不是官方戰鬥引擎；僅示範攻擊次數、技能施放時機、怒與阻隔判斷。回復、狀態與傷害結算為方便學習的自定規則，不能據此預測真實關卡。</div><div class="row" style="justify-content:space-between;margin:17px 0;flex-wrap:wrap"><span class="chip">${s.stage==='boss'?'Boss 戰':'R1'} · T${s.turn} · ${s.chain} C</span><span class="chip">我方 HP ${s.hp.toLocaleString()} / ${s.maxhp.toLocaleString()}</span><span class="chip">增傷 ${s.buff>0?'有效 '+s.buff+' 回合':'無'} · 減傷 ${s.shield>0?'有效 '+s.shield+' 回合':'無'}</span></div><div class="sim-enemies">${s.enemies.map(e=>`<div class="enemy ${e.hp<=0?'dead':''}"><div class="emoji">${e.emoji}</div><strong class="small">${e.name}</strong><div class="small muted">HP ${e.hp.toLocaleString()}/${e.max.toLocaleString()}</div><div class="hpbar"><span style="width:${Math.round(e.hp/e.max*100)}%"></span></div><div class="small" style="color:var(--gold)">${e.layers?`多層屏障 ${e.layers}`:e.angry?'怒：阻隔／詛咒':e.hp<=0?'已擊倒':'等待行動'}</div></div>`).join('')}</div><div class="train-grid" style="margin-top:20px"><div class="training-card"><h3>我方技能</h3><p>1P 攻擊強化：提升 2P、3P 的輸出（SS）<br>5P 減傷：減少所受傷害（SS）<br>4P：每次答對自動回復 2,250 HP</p><div class="sim-actions"><button class="btn" onclick="simSkill('buff')" ${s.ended?'disabled':''}>使用 1P 增傷</button><button class="btn" onclick="simSkill('shield')" ${s.ended?'disabled':''}>使用 5P 減傷</button></div><p class="small muted">技能有模擬 CD；如果按太早，戰鬥紀錄會提醒你。</p></div><div class="training-card"><h3>鎖定攻擊目標</h3><div class="field"><label>2P · 五連擊（每下 ${s.buff>0?'5,000':'3,000'}）</label><select onchange="simTarget('targetHits',this.value)" ${s.ended?'disabled':''}>${s.enemies.filter(e=>e.hp>0).map(e=>`<option value="${e.id}" ${s.targetHits===e.id?'selected':''}>${e.name}</option>`).join('')}</select></div><div class="field"><label>3P · 單次高傷害（${(s.buff>0?40000:20000).toLocaleString()}）</label><select onchange="simTarget('targetStrike',this.value)" ${s.ended?'disabled':''}>${s.enemies.filter(e=>e.hp>0).map(e=>`<option value="${e.id}" ${s.targetStrike===e.id?'selected':''}>${e.name}</option>`).join('')}</select></div><button class="btn gold" style="width:100%" onclick="playBattle()" ${s.ended?'disabled':''}>✓ 答對一題 · 執行本回合</button></div></div><div style="margin-top:18px"><div class="row" style="justify-content:space-between"><strong>戰鬥紀錄</strong><span class="muted small">最新訊息在下方</span></div><div class="sim-log" id="simLog">${s.history.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>${s.ended?`<div class="feedback ${s.hp>0?'good':'bad'}"><strong>${s.hp>0?'✓ 成功通關':'✖ 此次失敗'}</strong><p>${s.hp>0?'你已使用鎖定、連擊與增益達成目標。試著不開減傷，或改成全隊打 Boss，觀察為何結果不同。':'可依戰鬥紀錄判斷是哪個敵人持續回血、攻擊被阻隔或防禦時機不足。'}</p><button class="btn gold" onclick="beginBattle()">再試一次</button></div>`:''}</div>`}
function calcView(){return `<div class="panel"><div class="kicker">DAMAGE SANDBOX</div><h2 style="margin:8px 0">AS 效果值／連擊／阻隔計算器</h2><p class="muted small">只模擬一般攻擊型 AS 的簡化公式，固定隨機值為 1；不包含完整主複屬、特效、敵方防禦、技能領域等。</p><div class="train-grid"><div><div class="field"><label>參與計算的攻擊力 ATK</label><input type="number" min="0" value="8000" id="cAtk" oninput="calculate()"></div><div class="field"><label>AS 攻擊效果值 E</label><input type="number" min="0" value="500" id="cEffect" oninput="calculate()"></div><div class="field"><label>目前 Chain</label><input type="number" min="0" value="20" id="cChain" oninput="calculate()"></div></div><div><div class="field"><label>屬性修正</label><select id="cAttr" onchange="calculate()"><option value="1.5">有利（1.5）</option><option value="1">一般（1.0）</option><option value="0.5">不利（0.5）</option></select></div><div class="field"><label>AS 倍率強化</label><select id="cKing" onchange="calculate()"><option value="1">沒有</option><option value="2">2 倍（教學）</option><option value="3">3 倍（教學）</option></select></div><div class="field"><label>攻擊次數（分配總傷害）</label><input type="number" id="cHits" min="1" max="50" value="5" oninput="calculate()"></div><div class="field"><label>敵方每下阻隔門檻</label><input type="number" id="cBlock" min="0" value="1500" oninput="calculate()"></div></div></div><div class="training-card" id="calcResult" style="margin-top:17px"></div><p class="muted small">計算式：ATK÷2 × (100＋E)÷100 × 屬性修正 × (1＋Chain÷100) × AS 倍率；平均分配到連擊次數，單次傷害未超過阻隔門檻時視為被擋。實際各次攻擊可能受取整、敵方防禦和特殊技能影響。</p></div>`}
function calculate(){const num=id=>Math.max(0,Number($(id)?.value)||0);const atk=num('cAtk'),effect=num('cEffect'),chain=num('cChain'),attr=num('cAttr'),king=num('cKing'),hits=Math.max(1,Math.min(50,num('cHits'))),bar=num('cBlock');const total=atk/2*((100+effect)/100)*attr*(1+chain/100)*king,one=total/hits,after=(one>bar?total:0);$('calcResult').innerHTML=`<div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><div class="muted small">簡化 AS 總傷害</div><h2 style="margin:3px 0;color:var(--gold)">${Math.round(total).toLocaleString()}</h2></div><div><div class="muted small">平均單下傷害</div><h2 style="margin:3px 0">${Math.round(one).toLocaleString()}</h2></div><div><div class="muted small">阻隔後估算</div><h2 style="margin:3px 0;color:${after?'var(--accent)':'var(--red)'}">${Math.round(after).toLocaleString()}</h2></div></div><p class="small">${bar>0?(after>0?'單次傷害高於阻隔門檻：簡化模型中可正常造成傷害。':'單次傷害不超過阻隔門檻：即使總傷害很高，仍可能每一下都被擋。'):'未設定阻隔門檻。'}</p>`}

function render(){nav();updateThemeButton();updateFontButton();const content=$('content');if(state.page==='home')content.innerHTML=home();else if(state.page==='chapter')content.innerHTML=chapter();else if(state.page==='search')content.innerHTML=searchPage();else if(state.page==='cards')content.innerHTML=cards();else if(state.page==='pools'){content.innerHTML=pools();updatePoolAdvice()}else if(state.page==='training'){content.innerHTML=train();if(state.trainTab==='calc')calculate()}else if(state.page==='glossary')content.innerHTML=glossary();else if(state.page==='links')content.innerHTML=linkHub();else if(state.page==='sources')content.innerHTML=sources();else content.innerHTML=home()}
window.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();state.page='search';render();$('globalSearch')?.focus()}if(e.key==='Escape')closeMenu()});
document.documentElement.dataset.theme=store.get('wiz-theme','light');document.documentElement.dataset.fontsize=store.get('wiz-fontsize','normal');
const hash=decodeURIComponent(location.hash.replace(/^#/,''));if(hash.startsWith('chapter/')){const parts=hash.split('/');state.page='chapter';state.part=Number(parts[1])||1;state.topic=parts[2]||null}else if(['home','search','cards','mine','training','glossary','links','sources'].includes(hash))state.page=hash;
render();
