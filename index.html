.chapter-drawer>summary,.topic-drawer>summary,.side-drawer>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:15px}
.chapter-drawer>summary::-webkit-details-marker,.topic-drawer>summary::-webkit-details-marker,.side-drawer>summary::-webkit-details-marker{display:none}
.chapter-drawer>summary{padding:19px 24px}.chapter-drawer[open]>summary{border-bottom:1px solid var(--line);background:var(--raised)}
.chapter-index{font:700 26px Georgia,serif;color:var(--blue);width:42px;flex:none}.chapter-summary{flex:1;display:grid;gap:5px}.chapter-summary strong{font-size:20px}.chapter-summary small{font-size:15px;color:var(--muted);line-height:1.5}.chapter-count{font-size:13px;color:var(--muted);white-space:nowrap}
.drawer-arrow{transition:transform .18s ease;font-size:23px;color:var(--muted);font-weight:400}.chapter-drawer[open]>.drawer-arrow,.chapter-drawer[open]>summary .drawer-arrow,.topic-drawer[open]>summary .drawer-arrow,.side-drawer[open]>summary .drawer-arrow{transform:rotate(180deg)}
.drawer-content{padding:18px 20px}.drawer-topics{display:grid;grid-template-columns:1fr;gap:5px}.drawer-topics button{border:none;background:transparent;border-radius:8px;padding:12px 12px;text-align:left;display:flex;gap:15px;align-items:center;font-size:16px;color:var(--ink)}.drawer-topics button:hover{background:var(--raised)}.drawer-topics button>span:first-child{min-width:32px;color:var(--muted);font-size:13px}.drawer-topics button b{flex:1;font-weight:550}.topic-go{font-size:19px;color:var(--blue)}
.topic-drawer{margin:22px 0}.topic-drawer>summary{padding:14px 20px;background:var(--raised);font-size:16px}.topic-drawer>summary strong{flex:1}.topic-drawer .topic-list{padding:14px;gap:7px}
.side-drawer{margin-bottom:8px;border-radius:10px}.side-drawer>summary{padding:11px;font-size:15px}.side-drawer[open]>summary{background:var(--raised)}.side-drawer .side-title{flex:1;font-weight:600}.side-drawer .number{width:24px;color:var(--blue);font-family:Georgia,serif;font-size:16px}.side-drawer .navcount{margin:0;padding:0 4px}.side-drawer .drawer-arrow{font-size:16px}.side-topics{border-top:1px solid var(--line);padding:7px 5px 10px;display:grid;gap:2px}.side-topics button{border:0;background:transparent;color:var(--soft);text-align:left;border-radius:7px;padding:10px 9px 10px 21px;font-size:14px;line-height:1.48}.side-topics button:hover,.side-topics button.chosen{background:var(--raised);color:var(--blue)}.side-topics .side-topic-heading{font-weight:700;color:var(--blue)}
.home-shortcuts{display:grid;gap:10px;margin-top:27px}.shortcut{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:19px 22px;color:var(--ink);display:flex;align-items:center;text-align:left;gap:17px;font-size:20px}.shortcut:hover{background:var(--raised)}.shortcut-icon{color:var(--blue);font-size:25px;min-width:30px}.shortcut>span:nth-child(2){flex:1;display:grid;gap:3px}.shortcut strong{font-size:18px}.shortcut small{font-size:14px;color:var(--muted)}
/* Readable one-column glossary, no two-across cards */
.glossary{display:grid;grid-template-columns:1fr!important;gap:0;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel)}
.gloss{border:0;border-bottom:1px solid var(--line);border-radius:0;display:flex;gap:23px;align-items:baseline;background:var(--panel);padding:18px 24px}.gloss:last-child{border-bottom:0}.gloss:nth-child(even){background:var(--bg)}.gloss strong{min-width:124px;max-width:160px;width:20%;flex:none;font-size:18px;color:var(--ink)}.gloss p{margin:0;color:var(--soft);font-size:17px;line-height:1.85}
/* Card catalogue, each result uses full row and readable review */
.encyclopedia-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 16px}.encyclopedia-tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;color:var(--ink);font-size:15px;padding:10px 17px}.encyclopedia-tab.chosen{background:var(--blue);border-color:var(--blue);color:#fff}.encyclopedia-tab small{font-size:12px;opacity:.8;margin-left:6px}
.card-help,.card-collection-notice{background:var(--raised);border:1px solid var(--line);border-radius:10px;color:var(--soft);padding:14px 18px;font-size:15px;line-height:1.7}.card-search{margin:14px 0}.card-search label{display:block;margin-bottom:6px;font-size:15px;font-weight:650}.card-search>div{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel)}.card-search input{min-width:0;flex:1;font-size:17px;background:transparent;color:var(--ink);border:0;outline:0}.card-search span{color:var(--muted)}.encyclopedia-list{display:grid;gap:15px;margin-top:17px}.encyclopedia-card{border:1px solid var(--line);background:var(--panel);border-radius:15px;overflow:hidden;display:grid;grid-template-columns:185px minmax(0,1fr);box-shadow:0 5px 21px #1c36500b}.encyclopedia-image{background:var(--raised);min-height:245px;position:relative;display:grid;place-items:center}.encyclopedia-image img{width:100%;height:100%;max-height:315px;object-fit:contain;display:block}.encyclopedia-image.image-error{background:var(--raised)}.encyclopedia-data{padding:19px 24px 21px}.card-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.card-no{color:var(--blue);font-size:18px}.card-rating{font-size:13px;background:var(--raised);border-radius:999px;padding:4px 9px;color:var(--soft)}.encyclopedia-data h3{font-size:20px;line-height:1.45;margin:10px 0 7px}.version-label{font-size:13px;color:var(--muted);margin:0 0 10px}.card-review{font-size:16px;line-height:1.8;color:var(--ink);margin:8px 0}.card-detail{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}.card-detail summary{font-size:15px;cursor:pointer;color:var(--blue);font-weight:650}.card-detail p{font-size:15px;color:var(--soft);line-height:1.85}.card-link-row{margin-top:12px;font-size:14px}
/* large-font control */
html[data-fontsize="large"] body{font-size:19px}html[data-fontsize="large"] .article-body{font-size:21px}html[data-fontsize="large"] .gloss p{font-size:20px}html[data-fontsize="large"] .topic-link,html[data-fontsize="large"] .drawer-topics button{font-size:19px}html[data-fontsize="large"] .encyclopedia-data .card-review{font-size:19px}html[data-fontsize="large"] .navbtn{font-size:17px}
@media(max-width:1050px){.layout{grid-template-columns:260px minmax(0,1fr)}.encyclopedia-card{grid-template-columns:150px minmax(0,1fr)}.chapter-count{display:none}}
@media(max-width:760px){.layout{display:block}.topbar{height:62px}.content{padding:20px 15px 60px}.hero{padding:26px 21px}.hero h1{font-size:34px}.hero p{font-size:16px}.article-body{font-size:17px}.article-body table{font-size:14px;display:block;overflow-x:auto}.chapter-drawer>summary{padding:16px 14px;gap:9px}.chapter-index{width:34px;font-size:22px}.chapter-summary strong{font-size:18px}.chapter-summary small{font-size:13px}.drawer-content{padding:10px}.drawer-topics button{font-size:15px;padding:10px}.topbar .crumb{font-size:11px}.appearance-btn{font-size:12px;padding:7px!important}.gloss{display:block;padding:15px 17px}.gloss strong{display:block;min-width:0;width:auto;max-width:none;margin-bottom:4px;font-size:18px}.gloss p{font-size:16px}.encyclopedia-card{grid-template-columns:122px minmax(0,1fr)}.encyclopedia-image{min-height:190px;align-items:start}.encyclopedia-image img{max-height:225px}.encyclopedia-data{padding:13px 12px}.encyclopedia-data h3{font-size:17px}.card-rating{font-size:11px}.version-label{font-size:12px}.card-review{font-size:14px}.card-detail p{font-size:14px}.card-help,.card-collection-notice{font-size:14px}.encyclopedia-tab{padding:8px 10px;font-size:13px}.top-btn.primary{display:none}}
@media(max-width:390px){.topbar .crumb{display:none}.encyclopedia-card{grid-template-columns:1fr}.encyclopedia-image{min-height:210px;max-height:290px}.encyclopedia-image img{max-height:285px}}

.hero.hero-magic::after{display:none}
.magic-hero-title{position:absolute;bottom:18px;left:28px;color:#fff;text-shadow:0 2px 9px rgba(5,18,41,.9);display:flex;flex-direction:column;gap:0}
.magic-hero-title span{font-size:15px;font-weight:700;letter-spacing:.1em}
.magic-hero-title strong{font-family:'Noto Serif TC',Georgia,serif;font-size:clamp(26px,3.8vw,39px);font-weight:800;letter-spacing:.1em;line-height:1.24}
.hero+.stats{margin:17px 0 20px}
.stats .stat{padding:12px 16px}
.section-head#bookChapters{margin-top:15px}
.section-head#bookChapters .kicker{display:none}
.home-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:19px}
.home-shortcuts .shortcut{min-width:0;padding:13px 15px}
.home-shortcuts .shortcut strong{font-size:17px}
.home-shortcuts .shortcut small{font-size:13px}
.resource-list{display:grid;grid-template-columns:1fr;gap:10px;margin-top:19px}
.resource-row{padding:20px 23px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}
.resource-row h3{font-size:20px;margin:7px 0 5px;line-height:1.38}
.resource-row h3 a{color:var(--ink)}
.resource-row h3 a:hover{color:var(--blue)}
.resource-row p{font-size:16px;line-height:1.7;margin:6px 0;color:var(--soft)}
.resource-row p.resource-focus{color:var(--ink);font-weight:650}
.resource-row p.resource-tip{border-top:1px dashed var(--line);color:var(--muted);padding-top:9px;margin-top:12px;font-size:14px}
.resource-top{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.resource-type{color:var(--blue);font-weight:750}.resource-tag{padding:2px 10px;background:var(--raised);border-radius:30px}
.link-filters{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.link-filters .pill{padding:7px 13px;font-size:14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink)}
.link-filters .pill.active{background:var(--blue);border-color:var(--blue);color:white}
.link-intro h3{margin-top:0;font-size:19px}.link-intro p{font-size:16px;line-height:1.76}
.card-index-gap{margin:14px 0 17px;border:1px solid var(--line);background:var(--panel);padding:14px 18px;border-radius:11px}
.card-index-gap summary{cursor:pointer;font-weight:750;font-size:17px}.card-index-gap p{font-size:16px;line-height:1.7}
@media(max-width:800px){.hero.hero-magic{height:225px;min-height:225px;background-position:45% center}.magic-hero-title{bottom:13px;left:19px}.home-shortcuts{grid-template-columns:1fr}}
@media(max-width:450px){.hero.hero-magic{height:190px;min-height:190px;background-position:46% center}.magic-hero-title strong{font-size:26px}.magic-hero-title span{font-size:12px}.resource-row{padding:16px}}

/* Compact forum-like article and index layout. The archive stays light-first. */
:root{--mine-border:#d7dfe9}html[data-theme="dark"]{--mine-border:#43566c}
.content{max-width:1320px} .article-body{line-height:1.92;letter-spacing:.012em} .article-body h2,.article-body h3{margin-top:1.4em;border-bottom:1px solid var(--line);padding-bottom:7px} .article-body p{margin:.9em 0}.article-body blockquote{padding:12px 17px}
.mine-notice{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:15px 20px;margin:17px 0 22px}.mine-notice summary{cursor:pointer;font-size:16px;font-weight:750}.mine-notice[open]{padding-bottom:12px}.mine-notice strong{font-size:16px}.mine-notice p{font-size:15px;margin:7px 0;line-height:1.78;color:var(--soft)}

<script>
const TOPICS=[{"part": 1, "id": "start", "title": "新手第一天：正確開局", "tags": ["新手", "教學", "新手塔", "888抽", "設定"], "html": "<blockquote>\n<p><strong>先完成必要的教學與福利，再處理限時活動；不必急著把所有主線打完。<\/strong><\/p>\n<\/blockquote>\n<p>推薦順序：① 完成教學與基本帳號綁定；② 在設定開啟「自動加入最愛」及「轉蛋機精靈發送目的地變更」；③ 完成新手塔；④ 使用新手福利／888 抽；⑤ 挑選一支能穩定答題通關的隊伍；⑥ 先參加即將結束的免費抽卡與活動。<\/p>\n<p>新手塔提供已強化的基礎配布，能教你理解純屬、界王、DAS、反轉等機制。<strong>注意：傳統純火／水／雷的「突破極限」核心並不全在新手塔<\/strong>。2026 年更新的新手資料列出相關活動：純火「神都4」、純水「黃金挑戰3」、純雷「庫洛姆・麥格納魔導戰線」。實際是否開放請查遊戲介面。<\/p>\n<p>不要一入坑就用水晶復活、賣限定卡，或把所有卡片一口氣領出禮物盒。配布＝不需用付費轉蛋取得的角色；大腿＝援助精靈。<\/p>\n", "raw": "> **先完成必要的教學與福利，再處理限時活動；不必急著把所有主線打完。**\n\n推薦順序：① 完成教學與基本帳號綁定；② 在設定開啟「自動加入最愛」及「轉蛋機精靈發送目的地變更」；③ 完成新手塔；④ 使用新手福利／888 抽；⑤ 挑選一支能穩定答題通關的隊伍；⑥ 先參加即將結束的免費抽卡與活動。\n\n新手塔提供已強化的基礎配布，能教你理解純屬、界王、DAS、反轉等機制。**注意：傳統純火／水／雷的「突破極限」核心並不全在新手塔**。2026 年更新的新手資料列出相關活動：純火「神都4」、純水「黃金挑戰3」、純雷「庫洛姆・麥格納魔導戰線」。實際是否開放請查遊戲介面。\n\n不要一入坑就用水晶復活、賣限定卡，或把所有卡片一口氣領出禮物盒。配布＝不需用付費轉蛋取得的角色；大腿＝援助精靈。"}, {"part": 1, "id": "basics", "title": "答題、屬性、攻擊的基本關係", "tags": ["答題", "火", "水", "雷", "光", "闇", "盤面"], "html": "<p>一般題目有屬性。選到符合我方攻擊屬性的盤面，正確作答後才能有效發動對應攻擊。常見基本相剋是 <strong>火剋雷、雷剋水、水剋火<\/strong>；光與闇互相牽制。光闇的細節，以及複屬性的攻擊判定，請以實際盤面與技能為準。<\/p>\n<p><strong>主屬性<\/strong>影響精靈的主要分類；有兩種屬性的角色，第二種稱為<strong>複屬性<\/strong>。例如「火水」與「水火」不一樣：前者主火、後者主水。<\/p>\n<p>答題時間關係到 AS 的優秀答題（Excellent）判定。一般四選一題在五秒內正確回答，才符合常見 AS 條件；但特殊技能可以修改時間判定。答錯題可能讓 AS、Chain、SS 技能循環無法按照攻略進行。<\/p>\n", "raw": "一般題目有屬性。選到符合我方攻擊屬性的盤面，正確作答後才能有效發動對應攻擊。常見基本相剋是 **火剋雷、雷剋水、水剋火**；光與闇互相牽制。光闇的細節，以及複屬性的攻擊判定，請以實際盤面與技能為準。\n\n**主屬性**影響精靈的主要分類；有兩種屬性的角色，第二種稱為**複屬性**。例如「火水」與「水火」不一樣：前者主火、後者主水。\n\n答題時間關係到 AS 的優秀答題（Excellent）判定。一般四選一題在五秒內正確回答，才符合常見 AS 條件；但特殊技能可以修改時間判定。答錯題可能讓 AS、Chain、SS 技能循環無法按照攻略進行。"}, {"part": 1, "id": "as-ss-ex", "title": "AS、SS、AS2、EX-AS 一次看懂", "tags": ["AS", "SS", "EX-AS", "L Mode", "冷卻"], "html": "<table>\n<thead>\n<tr>\n  <th>名稱<\/th>\n  <th>白話說明<\/th>\n  <th>典型用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>AS<\/td>\n  <td>正確且符合時間條件時觸發<\/td>\n  <td>攻擊、連擊、回復、增傷<\/td>\n<\/tr>\n<tr>\n  <td>SS<\/td>\n  <td>充填完成後主動使用的技能<\/td>\n  <td>大魔術、加 C、減傷、界王、反轉<\/td>\n<\/tr>\n<tr>\n  <td>SS1 / SS2<\/td>\n  <td>同一角色可依冷卻發動不同版本<\/td>\n  <td>SS2 未必更適合當前戰況<\/td>\n<\/tr>\n<tr>\n  <td>L Mode<\/td>\n  <td>達到較高技能充填階段<\/td>\n  <td>通常改用 AS2，並可觸發 L Mode 潛能<\/td>\n<\/tr>\n<tr>\n  <td>EX-AS<\/td>\n  <td>另一種裝備／使用模式<\/td>\n  <td>達成 EX 條件，自動產生效果，通常不能主動使用同卡 SS<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>SS 模式和 EX-AS 模式不是同時享受兩套完整功能。<\/strong> 如果一張卡在 SS 模式是隊伍核心、在 EX-AS 模式是貫穿打手，必須依關卡選擇。同時，EX-AS 發動中通常不接受多數一般 SS Buff，但有特定例外與專門支援技能。<\/p>\n", "raw": "| 名稱 | 白話說明 | 典型用途 |\n|---|---|---|\n| AS | 正確且符合時間條件時觸發 | 攻擊、連擊、回復、增傷 |\n| SS | 充填完成後主動使用的技能 | 大魔術、加 C、減傷、界王、反轉 |\n| SS1 / SS2 | 同一角色可依冷卻發動不同版本 | SS2 未必更適合當前戰況 |\n| L Mode | 達到較高技能充填階段 | 通常改用 AS2，並可觸發 L Mode 潛能 |\n| EX-AS | 另一種裝備／使用模式 | 達成 EX 條件，自動產生效果，通常不能主動使用同卡 SS |\n\n**SS 模式和 EX-AS 模式不是同時享受兩套完整功能。** 如果一張卡在 SS 模式是隊伍核心、在 EX-AS 模式是貫穿打手，必須依關卡選擇。同時，EX-AS 發動中通常不接受多數一般 SS Buff，但有特定例外與專門支援技能。"}, {"part": 1, "id": "chain", "title": "Chain（C）與高連鎖打手", "tags": ["Chain", "C", "加C", "爆裂連鎖"], "html": "<p>Chain（連鎖數）是答題與特定技能累積的戰鬥資源。一般情況下正確答題會累積 C，許多角色寫著「10C／20C／40C 以上再提升效果值」。<\/p>\n<p>例如某角色在 20C 時額外增加 1500 效果值；在 40C 時再增加 2500。如果寫「再提升」，符合兩個階段時兩者都要加；如果寫「變成」，就不能重複加。<\/p>\n<p><strong>高 C 打手不一定不好用，可能只是缺少加 C 角色。<\/strong> 但敵人也可能在特定 C 數量時怒、消耗 Chain、或施加法則反轉〈連鎖〉，因此不是 C 越多就永遠越安全。<\/p>\n", "raw": "Chain（連鎖數）是答題與特定技能累積的戰鬥資源。一般情況下正確答題會累積 C，許多角色寫著「10C／20C／40C 以上再提升效果值」。\n\n例如某角色在 20C 時額外增加 1500 效果值；在 40C 時再增加 2500。如果寫「再提升」，符合兩個階段時兩者都要加；如果寫「變成」，就不能重複加。\n\n**高 C 打手不一定不好用，可能只是缺少加 C 角色。** 但敵人也可能在特定 C 數量時怒、消耗 Chain、或施加法則反轉〈連鎖〉，因此不是 C 越多就永遠越安全。"}, {"part": 1, "id": "growth", "title": "卡片養成、進化、瑪娜、潛能與契約", "tags": ["進化", "L", "瑪娜", "潛能", "契約", "Cost"], "html": "<p>養成大致包含：進化到可用階級（通常 L）→ 提升等級 → 開啟潛在能力 → 補瑪娜 → 提高契約等級，必要時配裝潛在結晶。<\/p>\n<p>潛能不只是提供 HP、ATK；還可能讓 SS 初次準備更快、免疫 AS／SS 封印、改變問題屬性出現率。有些攻略必須靠特定潛能或結晶，才能在指定回合施放 SS。<\/p>\n<p><strong>契約等級 3<\/strong>通常是解鎖 EX-AS 相關機能的重要門檻。Cost 是隊伍費用限制；如果你有高稀有卡卻無法全部放進隊伍，先檢查總 Cost。<\/p>\n<p>不必同時把數百張卡練滿；優先投資現役隊伍核心、泛用輔助與可靠的 AUTO 打手。<\/p>\n", "raw": "養成大致包含：進化到可用階級（通常 L）→ 提升等級 → 開啟潛在能力 → 補瑪娜 → 提高契約等級，必要時配裝潛在結晶。\n\n潛能不只是提供 HP、ATK；還可能讓 SS 初次準備更快、免疫 AS／SS 封印、改變問題屬性出現率。有些攻略必須靠特定潛能或結晶，才能在指定回合施放 SS。\n\n**契約等級 3**通常是解鎖 EX-AS 相關機能的重要門檻。Cost 是隊伍費用限制；如果你有高稀有卡卻無法全部放進隊伍，先檢查總 Cost。\n\n不必同時把數百張卡練滿；優先投資現役隊伍核心、泛用輔助與可靠的 AUTO 打手。"}, {"part": 1, "id": "starter-team", "title": "第一支五人隊怎麼組", "tags": ["五人", "配隊", "輸出", "生存", "輔助"], "html": "<p>新手可以先用簡化模板：①主要輸出、②輔助輸出／多連擊、③核心增益、④回復／防禦、⑤加 C／技能充填／敵人對策。<\/p>\n<p>這只是功能位置，不是硬性指定五張類型。某張卡可能同時輸出與回血，一個位置就能處理多個問題。<\/p>\n<p>先讓角色符合核心屬性條件，再看技能是否能互相搭配。不要因為五張卡的攻擊力排名最高，就認為組在一起必然最強。遇到不懂的卡時，先回答「它在隊伍裡負責什麼？沒有它哪個功能會失去？」。<\/p>\n", "raw": "新手可以先用簡化模板：①主要輸出、②輔助輸出／多連擊、③核心增益、④回復／防禦、⑤加 C／技能充填／敵人對策。\n\n這只是功能位置，不是硬性指定五張類型。某張卡可能同時輸出與回血，一個位置就能處理多個問題。\n\n先讓角色符合核心屬性條件，再看技能是否能互相搭配。不要因為五張卡的攻擊力排名最高，就認為組在一起必然最強。遇到不懂的卡時，先回答「它在隊伍裡負責什麼？沒有它哪個功能會失去？」。"}, {"part": 2, "id": "17-elements", "title": "17 種屬性完整速查", "tags": ["17種屬性", "純火", "純水", "純雷", "光", "闇", "主複"], "html": "<p>黑貓的基礎組合共 <strong>17 種<\/strong>：五種純屬性（純火、純水、純雷、純光、純闇），以及火水、火雷、火光、火闇、水火、水雷、水光、水闇、雷火、雷水、雷光、雷闇共十二種複屬。<\/p>\n<table>\n<thead>\n<tr>\n  <th>主屬性<\/th>\n  <th>可用組合<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>火<\/td>\n  <td>純火、火水、火雷、火光、火闇<\/td>\n<\/tr>\n<tr>\n  <td>水<\/td>\n  <td>純水、水火、水雷、水光、水闇<\/td>\n<\/tr>\n<tr>\n  <td>雷<\/td>\n  <td>純雷、雷火、雷水、雷光、雷闇<\/td>\n<\/tr>\n<tr>\n  <td>光<\/td>\n  <td>純光<\/td>\n<\/tr>\n<tr>\n  <td>闇<\/td>\n  <td>純闇<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>純火不是火火<\/strong>；火水也不等於水火。屬性是精靈分類，<strong>「界王」「DAS」「反轉」則是組隊體系<\/strong>。台版有自製與跨體系技能，不能把典型屬性分類當成任何卡片都不會突破的鐵律。<\/p>\n", "raw": "黑貓的基礎組合共 **17 種**：五種純屬性（純火、純水、純雷、純光、純闇），以及火水、火雷、火光、火闇、水火、水雷、水光、水闇、雷火、雷水、雷光、雷闇共十二種複屬。\n\n| 主屬性 | 可用組合 |\n|---|---|\n| 火 | 純火、火水、火雷、火光、火闇 |\n| 水 | 純水、水火、水雷、水光、水闇 |\n| 雷 | 純雷、雷火、雷水、雷光、雷闇 |\n| 光 | 純光 |\n| 闇 | 純闇 |\n\n**純火不是火火**；火水也不等於水火。屬性是精靈分類，**「界王」「DAS」「反轉」則是組隊體系**。台版有自製與跨體系技能，不能把典型屬性分類當成任何卡片都不會突破的鐵律。"}, {"part": 2, "id": "pure", "title": "純火／純水／純雷隊：強化與突破極限", "tags": ["純屬", "突破極限", "純屬性強化", "限界"], "html": "<p>純屬隊以五張相同純屬性角色為典型配置，例如五張純水。<strong>純屬性強化<\/strong>直接提高適用隊友的 HP、攻擊力；<strong>突破極限<\/strong>則提高某些能力值增益可累積的上限、在條件達成時取得額外效果。<\/p>\n<p>假設原本可累積的能力強化上限為 +12,000，突破極限使其變為 +24,000：上限變高<strong>不代表自動把缺少的 12,000 點補上<\/strong>，仍要施放適當能力值提升技能。<\/p>\n<p>典型五人功能：突破極限／純屬性強化／AS或SS打手／加 C／回復減傷。把水雷角色混入純水隊，可能無法享受核心的純屬限定效果。<\/p>\n<p>新手塔有基本純屬隊教學與配布，但不要誤認為傳統三屬突破極限全部都來自新手塔。<\/p>\n", "raw": "純屬隊以五張相同純屬性角色為典型配置，例如五張純水。**純屬性強化**直接提高適用隊友的 HP、攻擊力；**突破極限**則提高某些能力值增益可累積的上限、在條件達成時取得額外效果。\n\n假設原本可累積的能力強化上限為 +12,000，突破極限使其變為 +24,000：上限變高**不代表自動把缺少的 12,000 點補上**，仍要施放適當能力值提升技能。\n\n典型五人功能：突破極限／純屬性強化／AS或SS打手／加 C／回復減傷。把水雷角色混入純水隊，可能無法享受核心的純屬限定效果。\n\n新手塔有基本純屬隊教學與配布，但不要誤認為傳統三屬突破極限全部都來自新手塔。"}, {"part": 2, "id": "lightdark", "title": "純光與純闇隊", "tags": ["純光", "純闇", "自傷", "異常", "突破極限"], "html": "<p>純光與純闇是沒有複屬性的獨立屬性，不是火光或火闇。它們像複光、複闇角色一樣，具有回復反轉的先天免疫特色。<\/p>\n<p><strong>純光<\/strong>典型以「突破極限・光」配合會造成我方自傷的強力技能。注意不同版本的自傷減輕範圍不一致：新手塔版對 AS 自傷的保護不代表一定涵蓋 SS 自傷。<\/p>\n<p><strong>純闇<\/strong>典型以「突破極限・闇」配合敵方異常狀態與特殊輸出；要先確認敵人是否可以被指定異常影響。兩種隊伍都可以搭配各自的純屬性強化。<\/p>\n", "raw": "純光與純闇是沒有複屬性的獨立屬性，不是火光或火闇。它們像複光、複闇角色一樣，具有回復反轉的先天免疫特色。\n\n**純光**典型以「突破極限・光」配合會造成我方自傷的強力技能。注意不同版本的自傷減輕範圍不一致：新手塔版對 AS 自傷的保護不代表一定涵蓋 SS 自傷。\n\n**純闇**典型以「突破極限・闇」配合敵方異常狀態與特殊輸出；要先確認敵人是否可以被指定異常影響。兩種隊伍都可以搭配各自的純屬性強化。"}, {"part": 2, "id": "king", "title": "界王隊：AS 倍率強化", "tags": ["界王", "AS倍率強化", "火水", "水火", "雷水"], "html": "<p>界王是玩家對 <strong>AS 倍率強化<\/strong> 的稱呼。原廠典型屬性：火水、水火、雷水。它讓符合條件的隊友 AS 攻擊倍率提高，常見完整同屬隊伍能發揮更高上限。<\/p>\n<p>假設 AS 基礎倍率為六倍，受到界王三倍強化，在其他條件符合時可理解為 <strong>6 × 3 = 18 倍<\/strong>。這是倍率概念，不代表最終傷害永遠直接三倍，還受防禦、Chain、屬性與各類特殊技能影響。<\/p>\n<p>典型組隊：AS 倍率核心＋高連鎖打手＋加 C＋能力強化＋回復／其他輔助。<strong>優點：高 AS 傷害；弱點：缺少攻擊次數時，多層屏障可能很麻煩。<\/strong><\/p>\n<p>真實例：圖鑑 <strong>No.13170 維多利亞・涅爾德（雷水）<\/strong>，其 AS 倍率強化可作為界王技能的讀法示範；在「實卡圖鑑」頁可連到圖文資料。<\/p>\n", "raw": "界王是玩家對 **AS 倍率強化** 的稱呼。原廠典型屬性：火水、水火、雷水。它讓符合條件的隊友 AS 攻擊倍率提高，常見完整同屬隊伍能發揮更高上限。\n\n假設 AS 基礎倍率為六倍，受到界王三倍強化，在其他條件符合時可理解為 **6 × 3 = 18 倍**。這是倍率概念，不代表最終傷害永遠直接三倍，還受防禦、Chain、屬性與各類特殊技能影響。\n\n典型組隊：AS 倍率核心＋高連鎖打手＋加 C＋能力強化＋回復／其他輔助。**優點：高 AS 傷害；弱點：缺少攻擊次數時，多層屏障可能很麻煩。**\n\n真實例：圖鑑 **No.13170 維多利亞・涅爾德（雷水）**，其 AS 倍率強化可作為界王技能的讀法示範；在「實卡圖鑑」頁可連到圖文資料。"}, {"part": 2, "id": "das", "title": "DAS／WAS 隊：雙重 AS 附加", "tags": ["DAS", "WAS", "火雷", "水雷", "雷火", "複封"], "html": "<p>DAS（Double AS；亦常稱 WAS）強調 <strong>AS 再發動一次<\/strong>，不是把所有傷害數字都直接乘二。原廠典型屬性為火雷、水雷、雷火。<\/p>\n<p>如果一張打手每次 AS 五連擊，雙重 AS 讓它發動兩次，在簡化條件下就提供十次攻擊判定，有利於多層屏障；如果是回復 AS，可能獲得兩次對應的回復效果。<\/p>\n<p>但 DAS 不代表「每次答題直接 +2C」、也不保證 SS 冷卻多減一回合。<\/p>\n<p><strong>複屬性封印強化（複封）<\/strong>可以暫時限制複屬性攻擊，交換基礎能力值與其他增益。當角色的 SS1 是 DAS、SS2 是複封時，SS2 並非在所有關卡都比 SS1 更好。<\/p>\n", "raw": "DAS（Double AS；亦常稱 WAS）強調 **AS 再發動一次**，不是把所有傷害數字都直接乘二。原廠典型屬性為火雷、水雷、雷火。\n\n如果一張打手每次 AS 五連擊，雙重 AS 讓它發動兩次，在簡化條件下就提供十次攻擊判定，有利於多層屏障；如果是回復 AS，可能獲得兩次對應的回復效果。\n\n但 DAS 不代表「每次答題直接 +2C」、也不保證 SS 冷卻多減一回合。\n\n**複屬性封印強化（複封）**可以暫時限制複屬性攻擊，交換基礎能力值與其他增益。當角色的 SS1 是 DAS、SS2 是複封時，SS2 並非在所有關卡都比 SS1 更好。"}, {"part": 2, "id": "reverse", "title": "反轉隊：主複屬性互換", "tags": ["反轉", "強化反轉", "複光", "複闇", "聖", "邪"], "html": "<p>典型反轉隊圍繞火光、水光、雷光或火闇、水闇、雷闇。<strong>強化反轉<\/strong>可將主、複屬性互換，例如火光變成光火，並按照技能設定提高基礎 HP 和攻擊力。<\/p>\n<p>要分清楚「基礎能力值增益」和普通能力值增益，前者並非把所有已疊加的面板 Buff 都再乘一次。<\/p>\n<p>反轉後主屬性改變，原本只回復「火屬性隊友」的補師，未必能回復變成光火的角色。<strong>所以反轉隊的回復與增傷對象要逐字確認。<\/strong><\/p>\n<p>常見變化還有強化反轉・聖、強化反轉・邪、聖邪、解除反轉大魔術。反轉不等同敵人使用的「回復反轉」。<\/p>\n", "raw": "典型反轉隊圍繞火光、水光、雷光或火闇、水闇、雷闇。**強化反轉**可將主、複屬性互換，例如火光變成光火，並按照技能設定提高基礎 HP 和攻擊力。\n\n要分清楚「基礎能力值增益」和普通能力值增益，前者並非把所有已疊加的面板 Buff 都再乘一次。\n\n反轉後主屬性改變，原本只回復「火屬性隊友」的補師，未必能回復變成光火的角色。**所以反轉隊的回復與增傷對象要逐字確認。**\n\n常見變化還有強化反轉・聖、強化反轉・邪、聖邪、解除反轉大魔術。反轉不等同敵人使用的「回復反轉」。"}, {"part": 2, "id": "fusion", "title": "融合隊：湊齊五種屬性", "tags": ["融合", "五屬", "融合強化", "融合突破極限"], "html": "<p>融合體系利用隊伍持有的 <strong>火、水、雷、光、闇<\/strong> 屬性種類決定技能效果。不是要求五張角色的主屬性都不一樣。<\/p>\n<p>例如「火水、火雷、火光、火闇、純火」，五張主屬性都是火，但全隊已經包含五屬。<\/p>\n<p><strong>先看隊伍有沒有湊齊五屬，再看融合技能到底會強化哪些角色。<\/strong> 即使五屬齊全，也不能假設所有角色都無條件吃到全部 Buff。<\/p>\n<p>主要技能類型包括融合強化、融合大魔術、融合突破極限。2026 年台版有跨體系及自製技能，詳細組隊以卡片文字為準。<\/p>\n", "raw": "融合體系利用隊伍持有的 **火、水、雷、光、闇** 屬性種類決定技能效果。不是要求五張角色的主屬性都不一樣。\n\n例如「火水、火雷、火光、火闇、純火」，五張主屬性都是火，但全隊已經包含五屬。\n\n**先看隊伍有沒有湊齊五屬，再看融合技能到底會強化哪些角色。** 即使五屬齊全，也不能假設所有角色都無條件吃到全部 Buff。\n\n主要技能類型包括融合強化、融合大魔術、融合突破極限。2026 年台版有跨體系及自製技能，詳細組隊以卡片文字為準。"}, {"part": 2, "id": "ex-team", "title": "EX-AS／AUTO 隊的組成", "tags": ["EX-AS", "AUTO", "全體化", "貫穿", "加C"], "html": "<p>對希望減少手動操作的新手，<strong>EX-AS 隊<\/strong>很值得先組。簡化模板：全體化／貫穿／回復／增加 Chain／EX 強化。<\/p>\n<p>EX-AS 的啟動條件可能是正確回答指定題數，或達到指定 Chain；啟動後仍可能有額外條件，如「20C 以上再貫穿屬性吸收」。<strong>發動 EX-AS ≠ 所有附加條件都已滿足。<\/strong><\/p>\n<p>SS 模式與 EX-AS 模式須分別評價。如果隊伍需要某一張 SS 開場增加 Chain，就不是完全依靠自動作戰的純 EX-AS 隊。<\/p>\n", "raw": "對希望減少手動操作的新手，**EX-AS 隊**很值得先組。簡化模板：全體化／貫穿／回復／增加 Chain／EX 強化。\n\nEX-AS 的啟動條件可能是正確回答指定題數，或達到指定 Chain；啟動後仍可能有額外條件，如「20C 以上再貫穿屬性吸收」。**發動 EX-AS ≠ 所有附加條件都已滿足。**\n\nSS 模式與 EX-AS 模式須分別評價。如果隊伍需要某一張 SS 開場增加 Chain，就不是完全依靠自動作戰的純 EX-AS 隊。"}, {"part": 2, "id": "team-roles", "title": "配隊模板與體系選擇", "tags": ["配隊", "核心", "打手", "加C", "統一強化"], "html": "<table>\n<thead>\n<tr>\n  <th>你擁有的核心<\/th>\n  <th>優先找的隊友<\/th>\n  <th>常見陷阱<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>突破極限<\/td>\n  <td>純屬強化、純屬打手<\/td>\n  <td>混入有複屬性的卡<\/td>\n<\/tr>\n<tr>\n  <td>界王<\/td>\n  <td>同指定屬性、高 C 打手、加 C<\/td>\n  <td>少一張指定屬可能降低倍率<\/td>\n<\/tr>\n<tr>\n  <td>DAS<\/td>\n  <td>同指定屬性、連擊／回復 AS<\/td>\n  <td>誤以為增加兩倍 Chain<\/td>\n<\/tr>\n<tr>\n  <td>強化反轉<\/td>\n  <td>複光或複闇、回復、輸出<\/td>\n  <td>反轉後其他技能不再符合主屬<\/td>\n<\/tr>\n<tr>\n  <td>融合強化<\/td>\n  <td>湊齊五屬、可受益的輸出<\/td>\n  <td>只湊顏色卻忽略技能對象<\/td>\n<\/tr>\n<tr>\n  <td>EX-AS<\/td>\n  <td>全體化、貫穿、回復、加 C<\/td>\n  <td>一般 SS Buff 不一定有效<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>同一張角色可能同時是打手、回復或體系輔助。實際關卡若有傷害次數、反射、恐怖等特殊機制，應以敵人需求優先調整隊員。<\/p>\n", "raw": "| 你擁有的核心 | 優先找的隊友 | 常見陷阱 |\n|---|---|---|\n| 突破極限 | 純屬強化、純屬打手 | 混入有複屬性的卡 |\n| 界王 | 同指定屬性、高 C 打手、加 C | 少一張指定屬可能降低倍率 |\n| DAS | 同指定屬性、連擊／回復 AS | 誤以為增加兩倍 Chain |\n| 強化反轉 | 複光或複闇、回復、輸出 | 反轉後其他技能不再符合主屬 |\n| 融合強化 | 湊齊五屬、可受益的輸出 | 只湊顏色卻忽略技能對象 |\n| EX-AS | 全體化、貫穿、回復、加 C | 一般 SS Buff 不一定有效 |\n\n同一張角色可能同時是打手、回復或體系輔助。實際關卡若有傷害次數、反射、恐怖等特殊機制，應以敵人需求優先調整隊員。"}, {"part": 3, "id": "read-card", "title": "如何讀一張卡：五元素拆解法", "tags": ["卡片", "技能判讀", "SS", "條件", "對象"], "html": "<p>面對一長串技能文字，先拆成五個欄位：<strong>對象、效果、條件、持續時間、限制<\/strong>。<\/p>\n<p>假設技能寫著：「在五回合內提高水屬隊友 AS 傷害（效果值 250），當隊伍全是水雷時再增加 350，並使全體隊友受到的傷害減少 20%。」<\/p>\n<ul>\n<li><strong>對象<\/strong>：水屬性隊友受到攻擊強化；全隊受到指定減傷。<\/li>\n<li><strong>效果<\/strong>：AS 傷害效果值 +250；條件成立再 +350；減傷 20%。<\/li>\n<li><strong>條件<\/strong>：五張全是指定水雷屬性，才能完整得到額外增傷。<\/li>\n<li><strong>期間<\/strong>：五回合。<\/li>\n<li><strong>限制<\/strong>：屬性不吻合的隊員可能吃不到增益。<\/li>\n<\/ul>\n<p>「<strong>再提升<\/strong>」通常要累加；「<strong>變成<\/strong>」表示改成指定值；「<strong>每增加一張<\/strong>」要注意計算上限。卡片強不強，需要同時看技能的啟動速度、對象、範圍與和隊伍其他卡的配合。<\/p>\n", "raw": "面對一長串技能文字，先拆成五個欄位：**對象、效果、條件、持續時間、限制**。\n\n假設技能寫著：「在五回合內提高水屬隊友 AS 傷害（效果值 250），當隊伍全是水雷時再增加 350，並使全體隊友受到的傷害減少 20%。」\n\n- **對象**：水屬性隊友受到攻擊強化；全隊受到指定減傷。\n- **效果**：AS 傷害效果值 +250；條件成立再 +350；減傷 20%。\n- **條件**：五張全是指定水雷屬性，才能完整得到額外增傷。\n- **期間**：五回合。\n- **限制**：屬性不吻合的隊員可能吃不到增益。\n\n「**再提升**」通常要累加；「**變成**」表示改成指定值；「**每增加一張**」要注意計算上限。卡片強不強，需要同時看技能的啟動速度、對象、範圍與和隊伍其他卡的配合。"}, {"part": 3, "id": "effect-values", "title": "效果值不能直接當最終傷害", "tags": ["效果值", "AS傷害", "SS傷害", "回復", "增益"], "html": "<p><strong>不同技能的效果值不可直接拿來比較。<\/strong><\/p>\n<table>\n<thead>\n<tr>\n  <th>類型<\/th>\n  <th>簡化意義<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>一般攻擊 AS，效果值 500<\/td>\n  <td>基礎倍率 (100＋500)／100＝6 倍<\/td>\n<\/tr>\n<tr>\n  <td>一般攻擊 SS，效果值 1000<\/td>\n  <td>通常以 1000／100＝10 倍的技能倍率理解<\/td>\n<\/tr>\n<tr>\n  <td>回復 AS，效果值 15<\/td>\n  <td>通常回復最大 HP 的 15%<\/td>\n<\/tr>\n<tr>\n  <td>減傷，效果值 20<\/td>\n  <td>一般減少所受傷害的 20%<\/td>\n<\/tr>\n<tr>\n  <td>阻隔傷害，門檻 1500<\/td>\n  <td>一次攻擊不超過 1500 時無效；超過門檻通常承受整次攻擊<\/td>\n<\/tr>\n<tr>\n  <td>HP／攻擊力提升 3000<\/td>\n  <td>通常為固定數值 +3000，非乘以 30 倍<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>注意一般 AS 和 SS 的基礎計算方式不同。<\/strong> 特殊 AS、特效、蓄積與多段技能可能有另外的公式；這裡只示範通常的讀法。<\/p>\n", "raw": "**不同技能的效果值不可直接拿來比較。**\n\n| 類型 | 簡化意義 |\n|---|---|\n| 一般攻擊 AS，效果值 500 | 基礎倍率 (100＋500)／100＝6 倍 |\n| 一般攻擊 SS，效果值 1000 | 通常以 1000／100＝10 倍的技能倍率理解 |\n| 回復 AS，效果值 15 | 通常回復最大 HP 的 15% |\n| 減傷，效果值 20 | 一般減少所受傷害的 20% |\n| 阻隔傷害，門檻 1500 | 一次攻擊不超過 1500 時無效；超過門檻通常承受整次攻擊 |\n| HP／攻擊力提升 3000 | 通常為固定數值 +3000，非乘以 30 倍 |\n\n**注意一般 AS 和 SS 的基礎計算方式不同。** 特殊 AS、特效、蓄積與多段技能可能有另外的公式；這裡只示範通常的讀法。"}, {"part": 3, "id": "as-damage", "title": "簡化 AS 傷害公式與連擊", "tags": ["公式", "AS", "連擊", "Chain", "相剋"], "html": "<p>一般攻擊型 AS 的簡化公式：<\/p>\n<p><code>AS 傷害 ≈ 攻擊力÷2 × (100+總 AS 效果值)÷100 × 屬性修正 × (1+Chain÷100) × 隨機值<\/code><\/p>\n<p>一般優勢屬性可用 1.5、不利 0.5，隨機值約 0.9～1.1 理解。此式沒有涵蓋所有現代攻擊機制與角色變換，複屬攻擊也有各自的結算。<\/p>\n<p><strong>五連擊的「效果值 1000」通常是分配到五次攻擊的總體傷害，不是每一下都各有完整的 1000 效果值。<\/strong> 多次攻擊可處理多層屏障，但可能被阻隔傷害擋住、受到多彈式反擊。<\/p>\n<p>例：單擊 50,000 和五次各 10,000 的總傷害接近，但敵人具有 15,000 的阻隔門檻時，單擊可能通過、五連擊可能全部無效。<\/p>\n", "raw": "一般攻擊型 AS 的簡化公式：\n\n`AS 傷害 ≈ 攻擊力÷2 × (100+總 AS 效果值)÷100 × 屬性修正 × (1+Chain÷100) × 隨機值`\n\n一般優勢屬性可用 1.5、不利 0.5，隨機值約 0.9～1.1 理解。此式沒有涵蓋所有現代攻擊機制與角色變換，複屬攻擊也有各自的結算。\n\n**五連擊的「效果值 1000」通常是分配到五次攻擊的總體傷害，不是每一下都各有完整的 1000 效果值。** 多次攻擊可處理多層屏障，但可能被阻隔傷害擋住、受到多彈式反擊。\n\n例：單擊 50,000 和五次各 10,000 的總傷害接近，但敵人具有 15,000 的阻隔門檻時，單擊可能通過、五連擊可能全部無效。"}, {"part": 3, "id": "buff-stack", "title": "多種增益怎麼加？", "tags": ["AS倍率", "界王", "增益", "相加", "相乘"], "html": "<p>同屬於一般 AS 效果值增益的部分，可以先加進 AS 的效果值，再依技能套用倍率類強化。例如 AS 本身 500，隊友提供 AS 增傷 200：一般基礎倍率 <code>(100+500+200)/100 = 8<\/code>；若符合界王三倍條件，可示意為 <code>8×3=24<\/code>。<\/p>\n<p>但 <strong>不能把任何兩個 Buff 都直接相加或相乘<\/strong>：同類型狀態可能彼此覆蓋，某些不適用 EX-AS；另有領域、基礎能力值提升、特殊反轉等獨立處理方式。<\/p>\n<p>遇到「為什麼我開了兩張增傷卻沒有變強」，先確認是不是同類型覆蓋、適用對象不同，或被敵人的詛咒解除。<\/p>\n", "raw": "同屬於一般 AS 效果值增益的部分，可以先加進 AS 的效果值，再依技能套用倍率類強化。例如 AS 本身 500，隊友提供 AS 增傷 200：一般基礎倍率 `(100+500+200)/100 = 8`；若符合界王三倍條件，可示意為 `8×3=24`。\n\n但 **不能把任何兩個 Buff 都直接相加或相乘**：同類型狀態可能彼此覆蓋，某些不適用 EX-AS；另有領域、基礎能力值提升、特殊反轉等獨立處理方式。\n\n遇到「為什麼我開了兩張增傷卻沒有變強」，先確認是不是同類型覆蓋、適用對象不同，或被敵人的詛咒解除。"}, {"part": 3, "id": "ss-timing", "title": "SS1、SS2、初速與循環 CD", "tags": ["SS1", "SS2", "冷卻", "初速", "技能充填"], "html": "<p>玩家攻略常寫 <code>2/5<\/code>，一般代表 <strong>第一次需要正確答題 2 次、往後完整冷卻 5 次<\/strong>。潛在能力與結晶可能改變初速，盤面技能與技充可能改變實際發動時點。<\/p>\n<p><code>0/8<\/code> 代表在通常條件下可以開場發動，但下一次需較久；<code>4/4<\/code> 首次較晚、後續循環可能更容易。<\/p>\n<p><strong>SS2 不一定比 SS1 更適合當下。<\/strong> 若 SS1 是 DAS，SS2 是複屬性封印強化，兩者解決的問題不同。升到可用 SS2 階段後通常不能自由選回 SS1，所以部分進階攻略會刻意控制技能時間。<\/p>\n", "raw": "玩家攻略常寫 `2/5`，一般代表 **第一次需要正確答題 2 次、往後完整冷卻 5 次**。潛在能力與結晶可能改變初速，盤面技能與技充可能改變實際發動時點。\n\n`0/8` 代表在通常條件下可以開場發動，但下一次需較久；`4/4` 首次較晚、後續循環可能更容易。\n\n**SS2 不一定比 SS1 更適合當下。** 若 SS1 是 DAS，SS2 是複屬性封印強化，兩者解決的問題不同。升到可用 SS2 階段後通常不能自由選回 SS1，所以部分進階攻略會刻意控制技能時間。"}, {"part": 3, "id": "ex-timing", "title": "EX-AS：啟動條件與附加條件", "tags": ["EX-AS", "常駐", "持續", "AUTO", "貫穿"], "html": "<p>EX-AS 的「發動條件」和「效果中的附加條件」是兩個不同層次。<\/p>\n<p>例如：正答一次，接下來三回合全體化並貫穿防禦；<strong>20C 以上再貫穿吸收<\/strong>。即使成功啟動 EX-AS，在未達 20C 時仍不能視為吸收貫穿。<\/p>\n<p>常見 EX 效果：全體化、連續化、貫穿、EX 強化、回復、增加 Chain、阻隔。常駐類條件可能寫「5C 以上，條件達成期間」，另一類則有固定持續回合。<\/p>\n<p>選 SS 還是 EX：需要手動加速、解除特殊效果或擔任隊伍核心時，優先考慮 SS；要 AUTO、全體清場、容易維持的貫穿時，考慮 EX。<\/p>\n", "raw": "EX-AS 的「發動條件」和「效果中的附加條件」是兩個不同層次。\n\n例如：正答一次，接下來三回合全體化並貫穿防禦；**20C 以上再貫穿吸收**。即使成功啟動 EX-AS，在未達 20C 時仍不能視為吸收貫穿。\n\n常見 EX 效果：全體化、連續化、貫穿、EX 強化、回復、增加 Chain、阻隔。常駐類條件可能寫「5C 以上，條件達成期間」，另一類則有固定持續回合。\n\n選 SS 還是 EX：需要手動加速、解除特殊效果或擔任隊伍核心時，優先考慮 SS；要 AUTO、全體清場、容易維持的貫穿時，考慮 EX。"}, {"part": 3, "id": "strength", "title": "怎樣才算真正的強卡？", "tags": ["強卡", "輸出", "輔助", "價值", "排行榜"], "html": "<p>判斷卡片價值至少看五個面向：<strong>實際輸出、啟動速度、技能循環、組隊彈性、不可替代性<\/strong>。一張核心輔助可能讓其他四張卡都變強，價值遠大於單張高傷害角色。<\/p>\n<p>例如 A 卡十回合後打 100 萬、B 卡開場打 50 萬；短回合競賽可能 B 更合適，長時間高難度不一定。<\/p>\n<p>值得留意的角色類型：隊伍核心、泛用全體貫穿、特殊異常免疫／解除、加 C／技充、可靠回復減傷。排行榜是參考，<strong>現有隊伍能否搭配<\/strong>更重要。<\/p>\n<p>看舊攻略注意卡片可能已進化解放：同一角色不同 LtoL 進化版本的<strong>圖鑑 No.<\/strong>、能力、甚至自傷條件可能不同，不可只認角色名字。<\/p>\n", "raw": "判斷卡片價值至少看五個面向：**實際輸出、啟動速度、技能循環、組隊彈性、不可替代性**。一張核心輔助可能讓其他四張卡都變強，價值遠大於單張高傷害角色。\n\n例如 A 卡十回合後打 100 萬、B 卡開場打 50 萬；短回合競賽可能 B 更合適，長時間高難度不一定。\n\n值得留意的角色類型：隊伍核心、泛用全體貫穿、特殊異常免疫／解除、加 C／技充、可靠回復減傷。排行榜是參考，**現有隊伍能否搭配**更重要。\n\n看舊攻略注意卡片可能已進化解放：同一角色不同 LtoL 進化版本的**圖鑑 No.**、能力、甚至自傷條件可能不同，不可只認角色名字。"}, {"part": 3, "id": "potentials", "title": "潛在能力、潛在結晶、L Mode", "tags": ["潛在能力", "煌眼", "劍聖眼", "結晶", "進化"], "html": "<p><strong>潛在能力<\/strong>是角色自帶被動；<strong>L Mode 潛能<\/strong>是在進入 L 時提供的額外效果；<strong>潛在結晶<\/strong>是裝備在角色上的額外能力。另有<strong>精靈大結晶<\/strong>，不屬於一般角色裝備。<\/p>\n<p>重要被動：初速縮短、AS／SS 封印無效、恐怖／詛咒相關免疫、答題難度或盤面出現率調整。常見經典結晶包含煌眼、劍聖眼等，但要看實際版本是否具備預期效果。<\/p>\n<p>裝結晶前先查 Cost 與效果啟動條件。如果結晶化會消耗精靈，<strong>不要把唯一的限定卡、活動任務必需卡隨便結晶化<\/strong>。<\/p>\n", "raw": "**潛在能力**是角色自帶被動；**L Mode 潛能**是在進入 L 時提供的額外效果；**潛在結晶**是裝備在角色上的額外能力。另有**精靈大結晶**，不屬於一般角色裝備。\n\n重要被動：初速縮短、AS／SS 封印無效、恐怖／詛咒相關免疫、答題難度或盤面出現率調整。常見經典結晶包含煌眼、劍聖眼等，但要看實際版本是否具備預期效果。\n\n裝結晶前先查 Cost 與效果啟動條件。如果結晶化會消耗精靈，**不要把唯一的限定卡、活動任務必需卡隨便結晶化**。"}, {"part": 3, "id": "card-diagnose", "title": "卡片使用不順的六種原因", "tags": ["卡關", "技能失效", "技能時間", "錯誤診斷"], "html": "<table>\n<thead>\n<tr>\n  <th>現象<\/th>\n  <th>優先檢查<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>傷害不如預期<\/td>\n  <td>AS1/AS2、Chain、增益對象、屬性、敵人防禦<\/td>\n<\/tr>\n<tr>\n  <td>補師存在仍死亡<\/td>\n  <td>補血對象、單次高傷害、貫通、回復反轉<\/td>\n<\/tr>\n<tr>\n  <td>SS 不能依攻略發動<\/td>\n  <td>潛能、結晶、技充、答題失誤、SS1/SS2<\/td>\n<\/tr>\n<tr>\n  <td>EX-AS 沒發動<\/td>\n  <td>契約與模式、啟動條件、持續回合、附加條件<\/td>\n<\/tr>\n<tr>\n  <td>開了 Buff 沒變強<\/td>\n  <td>同類型覆蓋、詛咒、反轉後對象不合<\/td>\n<\/tr>\n<tr>\n  <td>火力很高卻過不了<\/td>\n  <td>敵人怒、吸收、屏障、死亡時行動<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>先對照失敗發生在哪一回合，再針對原因調整<\/strong>，不必一開始就把五張卡全換掉。<\/p>\n", "raw": "| 現象 | 優先檢查 |\n|---|---|\n| 傷害不如預期 | AS1/AS2、Chain、增益對象、屬性、敵人防禦 |\n| 補師存在仍死亡 | 補血對象、單次高傷害、貫通、回復反轉 |\n| SS 不能依攻略發動 | 潛能、結晶、技充、答題失誤、SS1/SS2 |\n| EX-AS 沒發動 | 契約與模式、啟動條件、持續回合、附加條件 |\n| 開了 Buff 沒變強 | 同類型覆蓋、詛咒、反轉後對象不合 |\n| 火力很高卻過不了 | 敵人怒、吸收、屏障、死亡時行動 |\n\n**先對照失敗發生在哪一回合，再針對原因調整**，不必一開始就把五張卡全換掉。"}, {"part": 4, "id": "freebies", "title": "新手福利：888 抽、會員、免費抽", "tags": ["888抽", "會員", "免費", "水晶", "新手"], "html": "<p>優先完成新手教學、新手塔、888 抽和當期限時免費十連。888 抽是跨年代大量補卡的福利，<strong>並非保證 888 張當代強力限定 L<\/strong>。先把全部免費抽卡完成，再檢查自己有哪些體系的核心與隊友，避免一張一張孤立判斷。<\/p>\n<p>2026/10 台版官網公告曾有：符合條件的新帳號綁定 So-net 會員取得 50 水晶，並有免費「新鮮潮流」新手轉蛋；<strong>實際時效、卡池機率與資格依當期公告<\/strong>。<\/p>\n<p>免費卡先保留，不要為了背包空間亂出售。抽卡前建議在設定啟用「自動加入最愛」及「轉蛋機精靈發送目的地變更」。<\/p>\n", "raw": "優先完成新手教學、新手塔、888 抽和當期限時免費十連。888 抽是跨年代大量補卡的福利，**並非保證 888 張當代強力限定 L**。先把全部免費抽卡完成，再檢查自己有哪些體系的核心與隊友，避免一張一張孤立判斷。\n\n2026/10 台版官網公告曾有：符合條件的新帳號綁定 So-net 會員取得 50 水晶，並有免費「新鮮潮流」新手轉蛋；**實際時效、卡池機率與資格依當期公告**。\n\n免費卡先保留，不要為了背包空間亂出售。抽卡前建議在設定啟用「自動加入最愛」及「轉蛋機精靈發送目的地變更」。"}, {"part": 4, "id": "gacha", "title": "選轉蛋池：補功能，不是盲目追高評", "tags": ["抽卡", "轉蛋", "保底", "水晶", "卡池"], "html": "<p>評估卡池的順序：① 有沒有缺少的隊伍核心？② 取得後能否直接搭配現有隊友？③ 同池有多少張真正想要的卡？④ 有什麼十連保底、附贈道具、抽數門檻？⑤ 能接受最多花多少水晶？<\/p>\n<p>「十連至少 S」<strong>不等於保證取得當期限定 L<\/strong>；「消耗 150 水晶取得福袋」也可能仍然是隨機獎勵。常見單抽 5 水晶、十連 50 水晶，但活動可能不同，應以池內詳細機率與規則為準。<\/p>\n<p>若一支火水界王隊只差加 C，抽能完成這一功能的角色，可能比抽一張完全沒有隊友的純雷輸出更有價值。不要把「差一張就齊」當成無限制追加水晶的理由。<\/p>\n", "raw": "評估卡池的順序：① 有沒有缺少的隊伍核心？② 取得後能否直接搭配現有隊友？③ 同池有多少張真正想要的卡？④ 有什麼十連保底、附贈道具、抽數門檻？⑤ 能接受最多花多少水晶？\n\n「十連至少 S」**不等於保證取得當期限定 L**；「消耗 150 水晶取得福袋」也可能仍然是隨機獎勵。常見單抽 5 水晶、十連 50 水晶，但活動可能不同，應以池內詳細機率與規則為準。\n\n若一支火水界王隊只差加 C，抽能完成這一功能的角色，可能比抽一張完全沒有隊友的純雷輸出更有價值。不要把「差一張就齊」當成無限制追加水晶的理由。"}, {"part": 4, "id": "selection", "title": "選卡：20 選 10 的正確理解", "tags": ["選卡", "20選10", "禮物盒", "持有"], "html": "<p>台版曾有「20 選 10」贈禮機制：從候選精靈中先選二十張，再依活動條件<strong>隨機<\/strong>取得其中若干角色，<strong>不是自由指定拿走十張<\/strong>。每期規則、名單、次數可能變動。<\/p>\n<p>候選優先考慮：缺少的核心、特殊免疫與罕見功能、可泛用的 EX-AS、加 C／技充、喜愛的收藏角色。<\/p>\n<p>務必核對禮物盒與圖鑑紀錄：有些活動的「已持有」標記未必包含尚未領出的卡。選前確認是不是已經有同一張，以及是否真的需要第二張。<\/p>\n", "raw": "台版曾有「20 選 10」贈禮機制：從候選精靈中先選二十張，再依活動條件**隨機**取得其中若干角色，**不是自由指定拿走十張**。每期規則、名單、次數可能變動。\n\n候選優先考慮：缺少的核心、特殊免疫與罕見功能、可泛用的 EX-AS、加 C／技充、喜愛的收藏角色。\n\n務必核對禮物盒與圖鑑紀錄：有些活動的「已持有」標記未必包含尚未領出的卡。選前確認是不是已經有同一張，以及是否真的需要第二張。"}, {"part": 4, "id": "recontract", "title": "一般再契約與奇蹟再契約", "tags": ["再契約", "奇蹟石", "重複卡", "五張"], "html": "<table>\n<thead>\n<tr>\n  <th>類型<\/th>\n  <th>典型素材<\/th>\n  <th>抽出結果<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>一般再契約<\/td>\n  <td>三張相同、且符合資格的轉蛋角色<\/td>\n  <td>從對應池取得其他隨機角色<\/td>\n<\/tr>\n<tr>\n  <td>奇蹟再契約<\/td>\n  <td>五張合資格 L 角色＋一顆奇蹟石<\/td>\n  <td>從當期奇蹟候選池隨機取得<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>兩者都<strong>無法指定想要的角色<\/strong>，也不是保證未持有卡。奇蹟候選池還有指定期限，並非永遠固定。<\/p>\n<p>安全原則：先保留至少一張卡；若同隊雙卡或特殊循環有用，就保留兩張以上。一般再契約通常有四張時消耗三張，還能留下第一張。奇蹟再契約的素材與角色取得來源有資格限制，L 階不代表一定符合。<\/p>\n<p>詳情可到官網「奇蹟再契約」公告確認。<\/p>\n", "raw": "| 類型 | 典型素材 | 抽出結果 |\n|---|---|---|\n| 一般再契約 | 三張相同、且符合資格的轉蛋角色 | 從對應池取得其他隨機角色 |\n| 奇蹟再契約 | 五張合資格 L 角色＋一顆奇蹟石 | 從當期奇蹟候選池隨機取得 |\n\n兩者都**無法指定想要的角色**，也不是保證未持有卡。奇蹟候選池還有指定期限，並非永遠固定。\n\n安全原則：先保留至少一張卡；若同隊雙卡或特殊循環有用，就保留兩張以上。一般再契約通常有四張時消耗三張，還能留下第一張。奇蹟再契約的素材與角色取得來源有資格限制，L 階不代表一定符合。\n\n詳情可到官網「奇蹟再契約」公告確認。"}, {"part": 4, "id": "duplicates", "title": "重複卡、A 卡、S 卡及喵廉社", "tags": ["重複", "A卡", "S卡", "喵廉社", "貓餅乾"], "html": "<p><strong>不是每張卡只需要一張。<\/strong> 高效攻擊 SS、SS／EX 雙用途、技能循環或特殊限制下，有時需要兩張或更多。<\/p>\n<p>舊 A／S 卡也不必一律出售：台版<strong>喵廉社<\/strong>會輪換指定回收名單，以舊轉蛋卡換取貓餅乾等特殊貨幣；並可能透過活動十連取得貓肉條。不是所有 A 卡都能在任何日期換取相同報酬。<\/p>\n<p>優先規則：唯一配布和限定卡先保留；重複 L 卡核對再契約資格；指定 A／S 卡核對當月喵廉社名單；不要把有圖鑑、隱藏任務、特殊進化用途的卡直接消耗。<\/p>\n", "raw": "**不是每張卡只需要一張。** 高效攻擊 SS、SS／EX 雙用途、技能循環或特殊限制下，有時需要兩張或更多。\n\n舊 A／S 卡也不必一律出售：台版**喵廉社**會輪換指定回收名單，以舊轉蛋卡換取貓餅乾等特殊貨幣；並可能透過活動十連取得貓肉條。不是所有 A 卡都能在任何日期換取相同報酬。\n\n優先規則：唯一配布和限定卡先保留；重複 L 卡核對再契約資格；指定 A／S 卡核對當月喵廉社名單；不要把有圖鑑、隱藏任務、特殊進化用途的卡直接消耗。"}, {"part": 4, "id": "inventory", "title": "禮物盒、保管庫與資源管理", "tags": ["禮物盒", "背包", "最愛", "素材", "水晶"], "html": "<p>推薦設定：<code>Menu → 遊戲設定 → 機能設定<\/code>，確認「自動加入最愛」與「轉蛋機精靈發送目的地變更」功能。<\/p>\n<p><strong>背包<\/strong>放目前使用的隊伍；<strong>保管庫<\/strong>存長期收藏與對策卡；<strong>禮物盒<\/strong>暫存尚未決定是否領出的轉蛋卡。對帶期限的轉蛋券、活動獎勵不能假設永遠保留。<\/p>\n<p>資源重要程度：水晶、奇蹟石與特殊結晶應謹慎；普通經驗、進化、開潛素材通常可優先投資現役隊伍；活動交換券要核對使用期限。<\/p>\n<p>玩得久的帳號需要的是<strong>完整的功能庫<\/strong>，而不是把所有角色堆到最高攻擊力。<\/p>\n", "raw": "推薦設定：`Menu → 遊戲設定 → 機能設定`，確認「自動加入最愛」與「轉蛋機精靈發送目的地變更」功能。\n\n**背包**放目前使用的隊伍；**保管庫**存長期收藏與對策卡；**禮物盒**暫存尚未決定是否領出的轉蛋卡。對帶期限的轉蛋券、活動獎勵不能假設永遠保留。\n\n資源重要程度：水晶、奇蹟石與特殊結晶應謹慎；普通經驗、進化、開潛素材通常可優先投資現役隊伍；活動交換券要核對使用期限。\n\n玩得久的帳號需要的是**完整的功能庫**，而不是把所有角色堆到最高攻擊力。"}, {"part": 5, "id": "event-priority", "title": "每天先做什麼：優先排序", "tags": ["日常", "活動", "時間管理", "新手"], "html": "<p>遊玩時間有限時，依序處理：① 即將到期的免費抽／限定領取；② 問答潮可收取的放置收益；③ 每日／每週／每月 Mission；④ 當期魔導盃／幻鬥戰；⑤ 當期限時活動的簡單關卡與配布；⑥ 新手塔與缺少的配布；⑦ 主線與過去活動。<\/p>\n<p><strong>例外：剛開帳號沒有基本戰力時，新手塔應提前。<\/strong> 如果活動很難，先拿得動的 Normal、故事、水晶和 Mission；不必為了 Extra 或超高難度花大量時間。<\/p>\n<p>10 月 2026 的活動日期僅作存檔示例，<strong>網站並不會自動更新當期活動<\/strong>。請點來源查最新公告。<\/p>\n", "raw": "遊玩時間有限時，依序處理：① 即將到期的免費抽／限定領取；② 問答潮可收取的放置收益；③ 每日／每週／每月 Mission；④ 當期魔導盃／幻鬥戰；⑤ 當期限時活動的簡單關卡與配布；⑥ 新手塔與缺少的配布；⑦ 主線與過去活動。\n\n**例外：剛開帳號沒有基本戰力時，新手塔應提前。** 如果活動很難，先拿得動的 Normal、故事、水晶和 Mission；不必為了 Extra 或超高難度花大量時間。\n\n10 月 2026 的活動日期僅作存檔示例，**網站並不會自動更新當期活動**。請點來源查最新公告。"}, {"part": 5, "id": "story", "title": "主線：不用急著全通", "tags": ["主線", "故事", "城市", "水晶"], "html": "<p>主線主要讓你了解魔法使、維茲與各地故事，也提供首次通關獎勵、Rank 經驗、部分配布／解鎖與交換相關資源。<\/p>\n<p>新手可先推進前段容易的章節，熟悉對敵作戰，不必趕最新城。高難度關卡有可能需要專門屬性、結晶與特殊機制對策，卡關後先去補隊伍很正常。<\/p>\n<p><strong>大部分主線可日後再推進<\/strong>；遇到真正的限時免費獎勵，先處理限時內容。不要用水晶反覆復活解決每個卡關問題。<\/p>\n", "raw": "主線主要讓你了解魔法使、維茲與各地故事，也提供首次通關獎勵、Rank 經驗、部分配布／解鎖與交換相關資源。\n\n新手可先推進前段容易的章節，熟悉對敵作戰，不必趕最新城。高難度關卡有可能需要專門屬性、結晶與特殊機制對策，卡關後先去補隊伍很正常。\n\n**大部分主線可日後再推進**；遇到真正的限時免費獎勵，先處理限時內容。不要用水晶反覆復活解決每個卡關問題。"}, {"part": 5, "id": "past", "title": "過去活動／你的書：精靈和結晶庫", "tags": ["過去活動", "你的書", "配布", "結晶"], "html": "<p>「你的書」是玩家習慣的舊稱，現在可在<strong>過去活動<\/strong>中尋找很多舊副本。一般活動經常重新開放，但合作、限定 Mission 和某些故事獎勵不一定保留。<\/p>\n<p>推薦按<strong>需求<\/strong>挑活動：缺回復或加 C 就找有對應配布的活動；缺特殊結晶就打它的原始副本；想補水晶就挑容易的首通。<\/p>\n<p>取得配布後要確認是否需要追加複本或特殊素材進化。某些隱藏關卡需要保留特定免費角色，不要隨便賣掉或結晶化。<\/p>\n<p>可查「千歲」：過去活動 → 活動任務 → Spring → 來自宇宙的刺客。它能幫助新手利用援助精靈；本文沒有可靠對應的卡圖／No.，故不收進『實卡圖鑑展示』頁以免誤貼。<\/p>\n", "raw": "「你的書」是玩家習慣的舊稱，現在可在**過去活動**中尋找很多舊副本。一般活動經常重新開放，但合作、限定 Mission 和某些故事獎勵不一定保留。\n\n推薦按**需求**挑活動：缺回復或加 C 就找有對應配布的活動；缺特殊結晶就打它的原始副本；想補水晶就挑容易的首通。\n\n取得配布後要確認是否需要追加複本或特殊素材進化。某些隱藏關卡需要保留特定免費角色，不要隨便賣掉或結晶化。\n\n可查「千歲」：過去活動 → 活動任務 → Spring → 來自宇宙的刺客。它能幫助新手利用援助精靈；本文沒有可靠對應的卡圖／No.，故不收進『實卡圖鑑展示』頁以免誤貼。"}, {"part": 5, "id": "event-difficulty", "title": "Normal、Hard、Extra、Sub、隱關", "tags": ["Normal", "Hard", "Extra", "Sub", "Mission", "隱藏"], "html": "<p>Normal 是基本難度，Hard 通常要求更好的隊伍；傳統 Extra 往往擁有較多雙色、三色題等較難答題環境，但並非每場活動都遵循完全相同規則。<\/p>\n<p><strong>通關 ≠ 完成所有 Sub Mission。<\/strong> 例如「無人死亡」「全部正解」「平均五秒內」都是附加條件；如果 AUTO 通關卻缺星，先查是哪個 Sub 沒有完成。<\/p>\n<p>隱關可能要求先完成 Normal、拿某張免費角色、將其進化到 L、完成特定 Mission。每個活動都不同。Boss 掉落的複本數也依活動而定，不能一律當作要刷四張。<\/p>\n<p>建議：故事／Normal → 低門檻配布／Mission → Hard → 特殊進化／隱關 → Extra／超高難度。<\/p>\n", "raw": "Normal 是基本難度，Hard 通常要求更好的隊伍；傳統 Extra 往往擁有較多雙色、三色題等較難答題環境，但並非每場活動都遵循完全相同規則。\n\n**通關 ≠ 完成所有 Sub Mission。** 例如「無人死亡」「全部正解」「平均五秒內」都是附加條件；如果 AUTO 通關卻缺星，先查是哪個 Sub 沒有完成。\n\n隱關可能要求先完成 Normal、拿某張免費角色、將其進化到 L、完成特定 Mission。每個活動都不同。Boss 掉落的複本數也依活動而定，不能一律當作要刷四張。\n\n建議：故事／Normal → 低門檻配布／Mission → Hard → 特殊進化／隱關 → Extra／超高難度。"}, {"part": 5, "id": "free-units", "title": "容易接觸的免費角色與援助戰術", "tags": ["新手塔", "千歲", "艾瑪莉麗絲", "大腿", "配布"], "html": "<p><strong>新手塔<\/strong>可獲得基本強化完成的教學隊員。純光／純闇後續新增的內容，不能只看早期新手文。<\/p>\n<p><strong>千歲<\/strong>：過去活動 → 活動任務 → Spring → 來自宇宙的刺客。用途是藉潛能使援助精靈提前換上場，且可切換純火／水／雷版本。<\/p>\n<p><strong>艾瑪莉麗絲<\/strong>：過去活動 → 寄語冬夜的祈願者 1 → Normal 初級取得指定卡，之後需要進化。其角色機制可讓你在指定時機手動替換援助者，但屬性相對固定。<\/p>\n<p>上述是<strong>取得路線／功能介紹<\/strong>，並非完整的卡片圖鑑紀錄；由於尚未取得可查證的卡圖與對應圖鑑 No.，此網站不為它們顯示錯誤圖片。<\/p>\n", "raw": "**新手塔**可獲得基本強化完成的教學隊員。純光／純闇後續新增的內容，不能只看早期新手文。\n\n**千歲**：過去活動 → 活動任務 → Spring → 來自宇宙的刺客。用途是藉潛能使援助精靈提前換上場，且可切換純火／水／雷版本。\n\n**艾瑪莉麗絲**：過去活動 → 寄語冬夜的祈願者 1 → Normal 初級取得指定卡，之後需要進化。其角色機制可讓你在指定時機手動替換援助者，但屬性相對固定。\n\n上述是**取得路線／功能介紹**，並非完整的卡片圖鑑紀錄；由於尚未取得可查證的卡圖與對應圖鑑 No.，此網站不為它們顯示錯誤圖片。"}, {"part": 5, "id": "quizrush", "title": "問答潮：放置收益與 Rush", "tags": ["問答潮", "放置", "Rush", "寶箱", "交換"], "html": "<p>問答潮（Quiz Rush）是一套<strong>Q 版角色與放置養成系統<\/strong>，並非直接讓你平常的五張精靈卡以相同規則戰鬥。可配置角色、切換屬性、累積 Rush 能量，並取得經驗、寶箱、賽季交換資源。<\/p>\n<p>玩家實測放置經驗儲存上限約 <strong>10 小時<\/strong>，因此進場推到放置效率尚可的關卡後，每天定期收取即可；不需要為了收益設定每小時鬧鐘。<\/p>\n<p>在 Rush 能量滿時，可配合 Boss 戰啟動。賽季有結束日、券可能有特定使用期限。新手優先取得容易達到的水晶及重要兌換商品，無需立刻硬打所有後段關卡。<\/p>\n", "raw": "問答潮（Quiz Rush）是一套**Q 版角色與放置養成系統**，並非直接讓你平常的五張精靈卡以相同規則戰鬥。可配置角色、切換屬性、累積 Rush 能量，並取得經驗、寶箱、賽季交換資源。\n\n玩家實測放置經驗儲存上限約 **10 小時**，因此進場推到放置效率尚可的關卡後，每天定期收取即可；不需要為了收益設定每小時鬧鐘。\n\n在 Rush 能量滿時，可配合 Boss 戰啟動。賽季有結束日、券可能有特定使用期限。新手優先取得容易達到的水晶及重要兌換商品，無需立刻硬打所有後段關卡。"}, {"part": 5, "id": "cup", "title": "大魔導盃：短期重複刷分活動", "tags": ["魔導盃", "Pt", "排名", "霸級", "絕級"], "html": "<p>大魔導盃通常是限期約數天的刷 Pt 活動，除了累積分數，也有參與、任務及排名相關獎勵。一般會看到霸級、絕級、全國爭霸賽等不同刷分方向。<\/p>\n<p>標準制度常見<strong>累計 600,000 Pt<\/strong>的重要精靈獎勵，玩家慣稱「總排」，但實際年度活動（復刻／2.0）可能調整，<strong>不能把它誤解為必須全服排名前幾名<\/strong>。高排名、進化素材與累積獎勵也要分開看。<\/p>\n<p>時間有限新手：先每天參加低門檻關卡與可完成的 Mission；等有能穩定高速刷分的隊伍，才考慮更高門檻。一次刷分拿得多，通常比總能勉強通關但每次很慢重要。<\/p>\n", "raw": "大魔導盃通常是限期約數天的刷 Pt 活動，除了累積分數，也有參與、任務及排名相關獎勵。一般會看到霸級、絕級、全國爭霸賽等不同刷分方向。\n\n標準制度常見**累計 600,000 Pt**的重要精靈獎勵，玩家慣稱「總排」，但實際年度活動（復刻／2.0）可能調整，**不能把它誤解為必須全服排名前幾名**。高排名、進化素材與累積獎勵也要分開看。\n\n時間有限新手：先每天參加低門檻關卡與可完成的 Mission；等有能穩定高速刷分的隊伍，才考慮更高門檻。一次刷分拿得多，通常比總能勉強通關但每次很慢重要。"}, {"part": 5, "id": "phantom", "title": "幻鬥戰：刻印、休閒、PASS", "tags": ["幻鬥戰", "刻印", "PASS", "休閒", "評價"], "html": "<p>幻鬥戰是由多個<strong>刻印任務<\/strong>構成的期間競賽。刻印會對敵人或我方附加更嚴格的限制：HP、傷害、屬性、種族、技能等。刻印高通常更難，也可能取得更多 Pt。<\/p>\n<p>典型制度包含四個分階段開放的任務、每日有限的 Pt 取得次數，以及<strong>PASS／略過<\/strong>已達成的成績。時間有限時，先找一場穩定可通過的刻印，再運用當期略過機制。<\/p>\n<p><strong>休閒模式<\/strong>相對容易取得積分，但典型整體評價上限為 A；若追求更高評價與進化報酬，選模式前先看當期不可逆限制。某些練習模式不消耗正式次數，也不取得正式 Pt。<\/p>\n", "raw": "幻鬥戰是由多個**刻印任務**構成的期間競賽。刻印會對敵人或我方附加更嚴格的限制：HP、傷害、屬性、種族、技能等。刻印高通常更難，也可能取得更多 Pt。\n\n典型制度包含四個分階段開放的任務、每日有限的 Pt 取得次數，以及**PASS／略過**已達成的成績。時間有限時，先找一場穩定可通過的刻印，再運用當期略過機制。\n\n**休閒模式**相對容易取得積分，但典型整體評價上限為 A；若追求更高評價與進化報酬，選模式前先看當期不可逆限制。某些練習模式不消耗正式次數，也不取得正式 Pt。"}, {"part": 5, "id": "missions", "title": "每日、每週、每月 Mission 與月轉", "tags": ["Mission", "轉蛋券", "日常", "每週", "每月"], "html": "<p>每日先打開 Mission 看哪些可順手完成。每週任務可透過正常推活動累積；每月的任務轉蛋券是穩定補角色的方式之一。<\/p>\n<p>要把<strong>轉蛋券取得截止日<\/strong>與<strong>使用截止日<\/strong>分開看。2026 年 10 月公告曾列取得到 11/1 14:59，使用到 11/8 14:59；這是當時的案例，不代表每個月固定同日期。<\/p>\n<p>如果黑貓問答 Mission 沒算完成，確認是否完成整輪答題、是否中途離開或斷線。<\/p>\n", "raw": "每日先打開 Mission 看哪些可順手完成。每週任務可透過正常推活動累積；每月的任務轉蛋券是穩定補角色的方式之一。\n\n要把**轉蛋券取得截止日**與**使用截止日**分開看。2026 年 10 月公告曾列取得到 11/1 14:59，使用到 11/8 14:59；這是當時的案例，不代表每個月固定同日期。\n\n如果黑貓問答 Mission 沒算完成，確認是否完成整輪答題、是否中途離開或斷線。"}, {"part": 5, "id": "resources", "title": "資源取得總整理", "tags": ["水晶", "經驗", "瑪娜", "潛能", "結晶", "交換"], "html": "<table>\n<thead>\n<tr>\n  <th>資源<\/th>\n  <th>主要取得方向<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>水晶<\/td>\n  <td>限時任務、主線首通、活動、魔導盃／幻鬥戰等<\/td>\n<\/tr>\n<tr>\n  <td>養成素材<\/td>\n  <td>素材關卡、Mission、活動交換所<\/td>\n<\/tr>\n<tr>\n  <td>免費精靈<\/td>\n  <td>新手塔、首通、活動 Pt、指定 Mission、交換所<\/td>\n<\/tr>\n<tr>\n  <td>潛在結晶<\/td>\n  <td>特定舊活動、任務與交換<\/td>\n<\/tr>\n<tr>\n  <td>精靈大結晶<\/td>\n  <td>特定活動與大結晶系統<\/td>\n<\/tr>\n<tr>\n  <td>轉蛋券<\/td>\n  <td>每日／每週／每月 Mission<\/td>\n<\/tr>\n<tr>\n  <td>貓餅乾、貓肉條等<\/td>\n  <td>喵廉社指定回收、指定轉蛋等<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>要找「什麼值得先刷」時，<strong>功能特殊的結晶或配布往往比大量普通經驗素材更有長期價值<\/strong>。<\/p>\n", "raw": "| 資源 | 主要取得方向 |\n|---|---|\n| 水晶 | 限時任務、主線首通、活動、魔導盃／幻鬥戰等 |\n| 養成素材 | 素材關卡、Mission、活動交換所 |\n| 免費精靈 | 新手塔、首通、活動 Pt、指定 Mission、交換所 |\n| 潛在結晶 | 特定舊活動、任務與交換 |\n| 精靈大結晶 | 特定活動與大結晶系統 |\n| 轉蛋券 | 每日／每週／每月 Mission |\n| 貓餅乾、貓肉條等 | 喵廉社指定回收、指定轉蛋等 |\n\n要找「什麼值得先刷」時，**功能特殊的結晶或配布往往比大量普通經驗素材更有長期價值**。"}, {"part": 5, "id": "time-plan", "title": "每天只有 5／15／30 分鐘", "tags": ["時間", "日常", "計畫", "優先"], "html": "<ul>\n<li><strong>5 分鐘：<\/strong> 確認當期免費獎勵與期限；收取問答潮；檢查 Mission；有魔導盃就確認每日參與。<\/li>\n<li><strong>15 分鐘：<\/strong> 完成上述內容，再處理容易的每日 Mission，參加幻鬥戰或魔導盃的一小段，打少量 Normal。<\/li>\n<li><strong>30 分鐘：<\/strong> 加上一個明確的帳號目標：取得某張配布、某顆結晶、完成指定 Hard，或試打一段主線。<\/li>\n<\/ul>\n<p>沒有時間不等於退步。<strong>可復刻／常駐內容不需要每天進行<\/strong>，把「避免獎勵過期」放在「清光所有內容」前面。<\/p>\n", "raw": "- **5 分鐘：** 確認當期免費獎勵與期限；收取問答潮；檢查 Mission；有魔導盃就確認每日參與。\n- **15 分鐘：** 完成上述內容，再處理容易的每日 Mission，參加幻鬥戰或魔導盃的一小段，打少量 Normal。\n- **30 分鐘：** 加上一個明確的帳號目標：取得某張配布、某顆結晶、完成指定 Hard，或試打一段主線。\n\n沒有時間不等於退步。**可復刻／常駐內容不需要每天進行**，把「避免獎勵過期」放在「清光所有內容」前面。"}, {"part": 6, "id": "enemy-read", "title": "高難度讀關：先制、行動週期、死亡時行動", "tags": ["先制", "行動", "怒", "死亡時行動", "關卡"], "html": "<p>進關卡先看：敵人位置與 HP → 先制 → 怒條件 → 怒後先制 → 行動循環 → 死亡時行動。<\/p>\n<p><strong>先制<\/strong>在一般回合行動前發生；<strong>怒後先制<\/strong>在條件達到並進入怒時發生；<strong>死亡時行動<\/strong>即使敵人已被打倒仍可能發動，不一定能靠快速擊殺躲掉。<\/p>\n<p>若左敵每回合回復敵方全體 100% HP，中敵只正常攻擊，右敵有屏障，常會優先處理左敵。<strong>擊殺順序由敵人功能與怒條件決定，不是只看 HP 最少或 Boss 最大隻。<\/strong><\/p>\n", "raw": "進關卡先看：敵人位置與 HP → 先制 → 怒條件 → 怒後先制 → 行動循環 → 死亡時行動。\n\n**先制**在一般回合行動前發生；**怒後先制**在條件達到並進入怒時發生；**死亡時行動**即使敵人已被打倒仍可能發動，不一定能靠快速擊殺躲掉。\n\n若左敵每回合回復敵方全體 100% HP，中敵只正常攻擊，右敵有屏障，常會優先處理左敵。**擊殺順序由敵人功能與怒條件決定，不是只看 HP 最少或 Boss 最大隻。**"}, {"part": 6, "id": "anger", "title": "怒條件：控傷、控 C、控擊殺順序", "tags": ["怒", "控傷", "控制Chain", "先制"], "html": "<p>怒條件可能是 HP 低於 50%、兩名敵人死亡、40C 以上、回合經過、SS 發動次數等。怒後可能改變攻擊方式，或立刻使用詛咒、阻隔、致命攻擊。<\/p>\n<p>例：Boss HP 1,000,000，低於 50% 怒後先制全體攻擊 9000。我方 HP 只有 7000，就不能毫無準備地把 Boss 打到 40% 而留下它；應提早開生存技能，或準備能直接擊殺的輸出。<\/p>\n<p><strong>傷害太高也可能讓抄攻略失敗<\/strong>：原作者 T6 才讓 Boss 怒，而你 T5 提前跨過 50%，導致技能未準備好。控傷是重要技巧。<\/p>\n", "raw": "怒條件可能是 HP 低於 50%、兩名敵人死亡、40C 以上、回合經過、SS 發動次數等。怒後可能改變攻擊方式，或立刻使用詛咒、阻隔、致命攻擊。\n\n例：Boss HP 1,000,000，低於 50% 怒後先制全體攻擊 9000。我方 HP 只有 7000，就不能毫無準備地把 Boss 打到 40% 而留下它；應提早開生存技能，或準備能直接擊殺的輸出。\n\n**傷害太高也可能讓抄攻略失敗**：原作者 T6 才讓 Boss 怒，而你 T5 提前跨過 50%，導致技能未準備好。控傷是重要技巧。"}, {"part": 6, "id": "defense", "title": "敵方防禦判斷：阻隔、多層、鐵壁、防護壁", "tags": ["阻隔", "屏障", "鐵壁", "防護壁", "貫穿"], "html": "<table>\n<thead>\n<tr>\n  <th>敵方狀態<\/th>\n  <th>運作核心<\/th>\n  <th>對策方向<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>阻隔傷害 1500<\/td>\n  <td>不超過門檻的<strong>單次<\/strong>傷害無效<\/td>\n  <td>單下高傷害、指定貫穿<\/td>\n<\/tr>\n<tr>\n  <td>多層屏障 10 層<\/td>\n  <td>要消耗攻擊判定次數<\/td>\n  <td>高連擊、DAS<\/td>\n<\/tr>\n<tr>\n  <td>防護壁 100,000<\/td>\n  <td>先削減指定防護耐久<\/td>\n  <td>足夠傷害、對應貫穿<\/td>\n<\/tr>\n<tr>\n  <td>鐵壁<\/td>\n  <td>多數普通攻擊每下只剩 1<\/td>\n  <td>連擊、毒、特定技能<\/td>\n<\/tr>\n<tr>\n  <td>屬性吸收<\/td>\n  <td>受到指定屬性攻擊反而回血<\/td>\n  <td>換屬性、貫穿吸收<\/td>\n<\/tr>\n<tr>\n  <td>多彈式反擊<\/td>\n  <td>受到多次攻擊可能反擊很多次<\/td>\n  <td>避免無謂高連擊<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>貫穿必須逐項看技能說明。<\/strong> 「貫穿防禦／阻隔／吸收」不代表能貫穿鐵壁，也不等於無視技能反射。<\/p>\n", "raw": "| 敵方狀態 | 運作核心 | 對策方向 |\n|---|---|---|\n| 阻隔傷害 1500 | 不超過門檻的**單次**傷害無效 | 單下高傷害、指定貫穿 |\n| 多層屏障 10 層 | 要消耗攻擊判定次數 | 高連擊、DAS |\n| 防護壁 100,000 | 先削減指定防護耐久 | 足夠傷害、對應貫穿 |\n| 鐵壁 | 多數普通攻擊每下只剩 1 | 連擊、毒、特定技能 |\n| 屬性吸收 | 受到指定屬性攻擊反而回血 | 換屬性、貫穿吸收 |\n| 多彈式反擊 | 受到多次攻擊可能反擊很多次 | 避免無謂高連擊 |\n\n**貫穿必須逐項看技能說明。** 「貫穿防禦／阻隔／吸收」不代表能貫穿鐵壁，也不等於無視技能反射。"}, {"part": 6, "id": "reflect", "title": "技能反射與屬性吸收不是一回事", "tags": ["技能反射", "無視反射", "吸收", "SS"], "html": "<p>敵人有技能反射時，對它使用適用反射條件的敵方目標 SS，可能引發詛咒、封印或強力傷害。一般對我方施放的增益／回復 SS 不會因敵人技能反射而自動被反擊。<\/p>\n<p>如果你的<strong>火屬性攻擊 SS 無視技能反射<\/strong>，但敵人同時有<strong>火屬性吸收<\/strong>：你可能不會吃反射，卻仍然幫敵人回復 HP。反之貫穿屬性吸收也不等於免疫技能反射。<\/p>\n<p>使用對敵 SS 前問：① 有無反射？② SS 是否明確無視？③ 屬性會不會被吸收？④ 有無 SS 耐性或其他防護？<\/p>\n", "raw": "敵人有技能反射時，對它使用適用反射條件的敵方目標 SS，可能引發詛咒、封印或強力傷害。一般對我方施放的增益／回復 SS 不會因敵人技能反射而自動被反擊。\n\n如果你的**火屬性攻擊 SS 無視技能反射**，但敵人同時有**火屬性吸收**：你可能不會吃反射，卻仍然幫敵人回復 HP。反之貫穿屬性吸收也不等於免疫技能反射。\n\n使用對敵 SS 前問：① 有無反射？② SS 是否明確無視？③ 屬性會不會被吸收？④ 有無 SS 耐性或其他防護？"}, {"part": 6, "id": "fields", "title": "領域、法則反轉與特殊狀態", "tags": ["領域", "法則反轉", "Chain", "詛咒", "AS弱化"], "html": "<p><strong>領域<\/strong>像是改變整個戰場的規則，不是單張角色一般 Buff。AS 弱化領域可能直接削減 AS 效果值，SS 弱化領域也可能使攻擊 SS 變弱；某些強化領域能覆蓋對應弱化領域。<\/p>\n<p><strong>法則反轉〈連鎖〉<\/strong>可能把原本增加 C 的效果改成消耗 C、把消耗 C 改成增加 C，還可能附帶上下限；<strong>法則反轉〈數值〉<\/strong>則改變某類能力增減的方向。不要以為靠普通狀態異常回復就能解除所有法則。<\/p>\n<p>其他常見敵技：詛咒（清 Buff／降能力）、恐怖（HP 條件限制 AS 或 SS）、技能抽取、時間跳躍、強制進行、Restart、AS／SS 耐性與弱化、死亡時行動。讀關卡文字判斷，不要只靠數值暴力輸出。<\/p>\n", "raw": "**領域**像是改變整個戰場的規則，不是單張角色一般 Buff。AS 弱化領域可能直接削減 AS 效果值，SS 弱化領域也可能使攻擊 SS 變弱；某些強化領域能覆蓋對應弱化領域。\n\n**法則反轉〈連鎖〉**可能把原本增加 C 的效果改成消耗 C、把消耗 C 改成增加 C，還可能附帶上下限；**法則反轉〈數值〉**則改變某類能力增減的方向。不要以為靠普通狀態異常回復就能解除所有法則。\n\n其他常見敵技：詛咒（清 Buff／降能力）、恐怖（HP 條件限制 AS 或 SS）、技能抽取、時間跳躍、強制進行、Restart、AS／SS 耐性與弱化、死亡時行動。讀關卡文字判斷，不要只靠數值暴力輸出。"}, {"part": 6, "id": "panel-crystal", "title": "盤面保留與精靈大結晶", "tags": ["盤保", "大結晶", "盤面變換", "題目"], "html": "<p><strong>盤面變換<\/strong>主要改變目前盤面；<strong>盤面保留（盤保）<\/strong>在指定期間持續提供設定好的屬性或特殊效果。盤面可以附帶回復、加 C、技能充填、增傷等功能。<\/p>\n<p><strong>精靈大結晶<\/strong>與裝在角色身上的潛在結晶不同。大結晶需先達成發動條件，再出現特殊盤面，正確回答該盤面後才發揮效果。有的大結晶可回復、減傷、阻隔或攻擊。<\/p>\n<p>攻略寫「先不要踩大結晶」，通常是因為需要把特殊盤面保留到 Boss 或指定回合。大結晶一出現就選取，不一定最好；實際保留與覆蓋仍受遊戲盤面規則限制。<\/p>\n", "raw": "**盤面變換**主要改變目前盤面；**盤面保留（盤保）**在指定期間持續提供設定好的屬性或特殊效果。盤面可以附帶回復、加 C、技能充填、增傷等功能。\n\n**精靈大結晶**與裝在角色身上的潛在結晶不同。大結晶需先達成發動條件，再出現特殊盤面，正確回答該盤面後才發揮效果。有的大結晶可回復、減傷、阻隔或攻擊。\n\n攻略寫「先不要踩大結晶」，通常是因為需要把特殊盤面保留到 Boss 或指定回合。大結晶一出現就選取，不一定最好；實際保留與覆蓋仍受遊戲盤面規則限制。"}, {"part": 6, "id": "walkthrough", "title": "完整示範：被封印的魔導書（教學假想關卡）", "tags": ["逐回合", "R1", "Boss", "鎖定", "技能順序"], "html": "<blockquote>\n<p>以下是<strong>純教學設計<\/strong>，敵方 HP、我方固定傷害與 CD 只為示範決策，並非真正副本或可直接照抄的角色組合。<\/p>\n<\/blockquote>\n<p><strong>R1 敵人：<\/strong> 左 HP 30,000，每回合回滿敵方全體；中 HP 120,000，在其餘兩敵死亡後怒並開阻隔 30,000；右 HP 40,000，開場四層屏障。<\/p>\n<p><strong>假想隊伍功能：<\/strong> 1P 增傷、2P 五連擊每下 5,000、3P 單下輸出 40,000、4P 回復、5P 減傷。假設 1P 可在怒後重新發動。<\/p>\n<table>\n<thead>\n<tr>\n  <th>步驟<\/th>\n  <th>目的<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>R1 T1：1P 增傷、5P 減傷，3P 鎖左、2P 鎖右<\/td>\n  <td>先除掉回復敵，並拆右側屏障<\/td>\n<\/tr>\n<tr>\n  <td>R1 T2：3P 鎖右、2P 鎖中<\/td>\n  <td>擊倒右敵，預備中敵怒後阻隔<\/td>\n<\/tr>\n<tr>\n  <td>R1 T3～T5：3P 持續打中<\/td>\n  <td>用高單次傷害突破 30,000 阻隔，維持回復<\/td>\n<\/tr>\n<tr>\n  <td>Boss T6：主要使用 AS<\/td>\n  <td>Boss 有技能反射與高 SS 耐性<\/td>\n<\/tr>\n<tr>\n  <td>Boss T7：跨越 50% 怒條件<\/td>\n  <td>Boss 清除我方增益<\/td>\n<\/tr>\n<tr>\n  <td>Boss T8：1P 重上增益，答題收掉<\/td>\n  <td>處理詛咒後的輸出下降<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>核心推理：<\/strong> 先移除回復→連擊拆層→高單擊破阻隔→控制怒時機→增益被清後重新建立輸出。不同關卡可能另有死亡時行動、反射、盤面限制，要另外納入。<\/p>\n", "raw": "> 以下是**純教學設計**，敵方 HP、我方固定傷害與 CD 只為示範決策，並非真正副本或可直接照抄的角色組合。\n\n**R1 敵人：** 左 HP 30,000，每回合回滿敵方全體；中 HP 120,000，在其餘兩敵死亡後怒並開阻隔 30,000；右 HP 40,000，開場四層屏障。\n\n**假想隊伍功能：** 1P 增傷、2P 五連擊每下 5,000、3P 單下輸出 40,000、4P 回復、5P 減傷。假設 1P 可在怒後重新發動。\n\n| 步驟 | 目的 |\n|---|---|\n| R1 T1：1P 增傷、5P 減傷，3P 鎖左、2P 鎖右 | 先除掉回復敵，並拆右側屏障 |\n| R1 T2：3P 鎖右、2P 鎖中 | 擊倒右敵，預備中敵怒後阻隔 |\n| R1 T3～T5：3P 持續打中 | 用高單次傷害突破 30,000 阻隔，維持回復 |\n| Boss T6：主要使用 AS | Boss 有技能反射與高 SS 耐性 |\n| Boss T7：跨越 50% 怒條件 | Boss 清除我方增益 |\n| Boss T8：1P 重上增益，答題收掉 | 處理詛咒後的輸出下降 |\n\n**核心推理：** 先移除回復→連擊拆層→高單擊破阻隔→控制怒時機→增益被清後重新建立輸出。不同關卡可能另有死亡時行動、反射、盤面限制，要另外納入。"}, {"part": 6, "id": "walkthrough-2", "title": "法則反轉教學：扭曲的法則", "tags": ["法則反轉", "領域", "回合", "解題"], "html": "<blockquote>\n<p>教學假想關卡：Boss 開場設置「法則反轉〈連鎖〉持續 3 回合」、「AS 弱化領域 −2000 持續 5 回合」及技能反射，之後使用多次連擊。<\/p>\n<\/blockquote>\n<p>錯誤操作：T1 不看法則就使用大量 +C，結果受到反轉影響，C 沒有增加；AS 又因弱化領域傷害大減，最後被連擊擊倒。<\/p>\n<p>合理思路：T1 優先處理 AS 領域弱化與生存；T2 視法則與上下限安排能利用反轉的技能；T3 視敵人攻擊時點選擇已出現的大結晶盤面；待反轉結束再恢復一般加 C 循環。<\/p>\n<p>這題要練的是：<strong>辨認「系統規則被改了」而非只覺得角色攻擊力不夠。<\/strong><\/p>\n", "raw": "> 教學假想關卡：Boss 開場設置「法則反轉〈連鎖〉持續 3 回合」、「AS 弱化領域 −2000 持續 5 回合」及技能反射，之後使用多次連擊。\n\n錯誤操作：T1 不看法則就使用大量 +C，結果受到反轉影響，C 沒有增加；AS 又因弱化領域傷害大減，最後被連擊擊倒。\n\n合理思路：T1 優先處理 AS 領域弱化與生存；T2 視法則與上下限安排能利用反轉的技能；T3 視敵人攻擊時點選擇已出現的大結晶盤面；待反轉結束再恢復一般加 C 循環。\n\n這題要練的是：**辨認「系統規則被改了」而非只覺得角色攻擊力不夠。**"}, {"part": 6, "id": "bahamut-guide", "title": "巴哈攻略 R1／T1／P／鎖定怎麼讀", "tags": ["巴哈", "R1", "T1", "SS2", "鎖左", "攻略"], "html": "<table>\n<thead>\n<tr>\n  <th>記號<\/th>\n  <th>意思<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n  <td>R1、R2、Boss<\/td>\n  <td>第 1 場、第 2 場、Boss 場<\/td>\n<\/tr>\n<tr>\n  <td>T1、T2<\/td>\n  <td>第 1、2 個回合／答題週期，作者寫法可能不同<\/td>\n<\/tr>\n<tr>\n  <td>1P～5P<\/td>\n  <td>隊伍從左到右第 1～5 個角色<\/td>\n<\/tr>\n<tr>\n  <td>3P SS2<\/td>\n  <td>第三位角色開第二段 SS<\/td>\n<\/tr>\n<tr>\n  <td>鎖左／鎖中／鎖右<\/td>\n  <td>指定敵方目標；注意是否全體鎖定<\/td>\n<\/tr>\n<tr>\n  <td>踩大結晶<\/td>\n  <td>選大結晶特殊盤面並答對<\/td>\n<\/tr>\n<tr>\n  <td>平 A<\/td>\n  <td>不額外施放特定 SS，正常答題<\/td>\n<\/tr>\n<tr>\n  <td>控血／控傷／控 C<\/td>\n  <td>刻意控制 HP、輸出量或 Chain<\/td>\n<\/tr>\n<tr>\n  <td>抓交替／抱大腿<\/td>\n  <td>運用援助精靈替換特定隊員<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>示例：<code>R1 T1：開 1P SS2 → 3P SS1 → 5P SS2；鎖左下，答水題<\/code> = 照順序點選技能，再指定左下敵人，選水題作答。<code>T3 不踩大結晶<\/code> = 先保留特殊盤面，以免之後需要時已用掉。<\/p>\n<p>部分攻略採<strong>全關累計 T<\/strong>，也有每場重新計算的寫法；SS 不答題直接收敵時，回合數可能沒有增加。以作者的完整操作順序優先。<\/p>\n", "raw": "| 記號 | 意思 |\n|---|---|\n| R1、R2、Boss | 第 1 場、第 2 場、Boss 場 |\n| T1、T2 | 第 1、2 個回合／答題週期，作者寫法可能不同 |\n| 1P～5P | 隊伍從左到右第 1～5 個角色 |\n| 3P SS2 | 第三位角色開第二段 SS |\n| 鎖左／鎖中／鎖右 | 指定敵方目標；注意是否全體鎖定 |\n| 踩大結晶 | 選大結晶特殊盤面並答對 |\n| 平 A | 不額外施放特定 SS，正常答題 |\n| 控血／控傷／控 C | 刻意控制 HP、輸出量或 Chain |\n| 抓交替／抱大腿 | 運用援助精靈替換特定隊員 |\n\n示例：`R1 T1：開 1P SS2 → 3P SS1 → 5P SS2；鎖左下，答水題` = 照順序點選技能，再指定左下敵人，選水題作答。`T3 不踩大結晶` = 先保留特殊盤面，以免之後需要時已用掉。\n\n部分攻略採**全關累計 T**，也有每場重新計算的寫法；SS 不答題直接收敵時，回合數可能沒有增加。以作者的完整操作順序優先。"}, {"part": 6, "id": "failure-diagnose", "title": "照抄攻略失敗：逐步定位錯誤", "tags": ["攻略", "傷害浮動", "CD", "錯誤", "失敗"], "html": "<p>如果同一份攻略的 T3 技能沒有好：檢查 SS1／SS2、初速潛能、結晶、技能充填、是否答錯、是否裝了 EX-AS。<\/p>\n<p>如果提前把 Boss 打怒：檢查攻擊力、Chain、傷害結晶、攻擊目標。<strong>傷害過高也可能使攻略失敗。<\/strong> 如果敵人沒按攻略怒：檢查擊殺順序與實際觸發條件。<\/p>\n<p>如果只有你死亡：比對敵人防禦貫通、詛咒、回復對象、HP、潛在結晶與援助者。<\/p>\n<p>如果盤面／大結晶對不上：檢查盤保、盤面保留持續時間、大結晶出現條件，以及是不是提前把盤面消耗掉。<\/p>\n<p><strong>每次只修正一個最主要失敗原因<\/strong>，測試是否改善；除非整個屬性體系不適合，否則不必全隊重組。<\/p>\n", "raw": "如果同一份攻略的 T3 技能沒有好：檢查 SS1／SS2、初速潛能、結晶、技能充填、是否答錯、是否裝了 EX-AS。\n\n如果提前把 Boss 打怒：檢查攻擊力、Chain、傷害結晶、攻擊目標。**傷害過高也可能使攻略失敗。** 如果敵人沒按攻略怒：檢查擊殺順序與實際觸發條件。\n\n如果只有你死亡：比對敵人防禦貫通、詛咒、回復對象、HP、潛在結晶與援助者。\n\n如果盤面／大結晶對不上：檢查盤保、盤面保留持續時間、大結晶出現條件，以及是不是提前把盤面消耗掉。\n\n**每次只修正一個最主要失敗原因**，測試是否改善；除非整個屬性體系不適合，否則不必全隊重組。"}, {"part": 6, "id": "practice-routine", "title": "學會獨立通關的固定流程", "tags": ["組隊", "關卡", "實戰", "戰術"], "html": "<p>① 看關卡限制與敵人資訊 → ② 列出最危險的先制、怒後先制、死亡時行動 → ③ 決定主輸出方式（AS／SS／EX）→ ④ 補齊必需對策（貫穿、連擊、回復、結晶）→ ⑤ 排出五人隊 → ⑥ 算重要 SS 發動回合 → ⑦ 先試打 → ⑧ 記下失敗回合 → ⑨ 對症調整。<\/p>\n<p><strong>判斷是缺「一個工具」還是「整體體系不合適」。<\/strong> 例如一隊水雷 DAS 已有足夠輸出，只缺解除吸收的手段，可能換一張卡即可；但敵人全面針對水雷，就考慮重選體系。<\/p>\n<p>後面的「訓練工坊」有：循序測驗、五人功能配隊練習、敵人目標順序模擬與傷害／屏障計算。它是教學沙盒，<strong>不是遊戲官方戰鬥引擎<\/strong>。<\/p>\n", "raw": "① 看關卡限制與敵人資訊 → ② 列出最危險的先制、怒後先制、死亡時行動 → ③ 決定主輸出方式（AS／SS／EX）→ ④ 補齊必需對策（貫穿、連擊、回復、結晶）→ ⑤ 排出五人隊 → ⑥ 算重要 SS 發動回合 → ⑦ 先試打 → ⑧ 記下失敗回合 → ⑨ 對症調整。\n\n**判斷是缺「一個工具」還是「整體體系不合適」。** 例如一隊水雷 DAS 已有足夠輸出，只缺解除吸收的手段，可能換一張卡即可；但敵人全面針對水雷，就考慮重選體系。\n\n後面的「訓練工坊」有：循序測驗、五人功能配隊練習、敵人目標順序模擬與傷害／屏障計算。它是教學沙盒，**不是遊戲官方戰鬥引擎**。"}];

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleTheme(){const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;store.set('wiz-theme',next);updateThemeButton()}
function updateThemeButton(){const t=$('themeButton');if(t){const dark=document.documentElement.dataset.theme==='dark';t.textContent=dark?'☀ 亮色':'☾ 暗色';t.setAttribute('aria-label',dark?'切換至亮色背景':'切換至暗色背景')}}

function openMenu(){$('sidebar').classList.add('show');$('overlay').classList.add('show')}
function closeMenu(){$('sidebar').classList.remove('show');$('overlay').classList.remove('show')}
function go(page,part,topic){state.page=page; if(part!=null)state.part=Number(part);if(topic!==undefined)state.topic=topic; else if(page==='chapter')state.topic=null; closeMenu();render();window.scrollTo({top:0,behavior:'instant'});try{history.replaceState(null,'','#'+(page==='chapter'?`chapter/${state.part}/${state.topic||''}`:page))}catch(e){}}
function jumpTopic(id){state.topic=id;render();window.scrollTo({top:0,behavior:'instant'})}
function setCrumb(label){$('crumb').textContent='魔導圖書館 / '+label}
function nav(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
  $('navChapters').innerHTML=CHAPTERS.map(c=>{const ts=TOPICS.filter(t=>t.part===c.no),active=state.page==='chapter'&&state.part===c.no;
    return `<details class="side-drawer" ${active?'open':''}><summary><span class="number">${String(c.no).padStart(2,'0')}</span><span class="side-title">${esc(c.name)}</span><span class="navcount">${ts.length}</span><span class="drawer-arrow">⌄</span></summary><div class="side-topics"><button class="side-topic-heading" onclick="go('chapter',${c.no})">◉ 第 ${c.no} 部總覽</button>${ts.map((t,i)=>`<button class="side-topic ${active&&state.topic===t.id?'chosen':''}" onclick="go('chapter',${c.no},'${t.id}')">${i+1}. ${esc(t.title)}</button>`).join('')}</div></details>`}).join('');
}

function chapter(){const ch=CHAPTERS.find(x=>x.no===state.part),topics=TOPICS.filter(x=>x.part===state.part),selected=topics.find(x=>x.id===state.topic);setCrumb(`第 ${ch.no} 部 / ${selected?selected.title:ch.name}`);const head=`<div class="breadcrumbs"><button onclick="go('home')">首頁</button><span>›</span><span>第 ${ch.no} 部</span>${selected?`<span>›</span><span>${esc(selected.title)}</span>`:''}</div>${layoutTitle('VOLUME '+String(ch.no).padStart(2,'0'),ch.name,ch.desc)}`;
const list=`<details class="topic-drawer" ${!selected?'open':''}><summary><span>☷</span><strong>第 ${ch.no} 部小分類目錄 · ${topics.length} 篇</strong><span class="drawer-arrow">⌄</span></summary><div class="topic-list">${topics.map((x,i)=>`<button class="topic-link ${selected?.id===x.id?'current':''}" onclick="jumpTopic('${x.id}')"><span class="ix">${String(i+1).padStart(2,'0')}</span><span>${esc(x.title)} ${learned[x.id]?'✓':''}</span></button>`).join('')}</div></details>`;
if(!selected)return head+list+`<div class="note">展開上方目錄，選一個小標題就能開始閱讀。也可利用左側「六大章節」抽屜直接跨章節跳轉。</div>`;

function deckView(){return `<div class="panel"><div class="row" style="align-items:end;justify-content:space-between;flex-wrap:wrap"><div><div class="kicker">TEAM CONSTRUCTION</div><h2 style="margin:8px 0">組一支五人隊伍</h2><p class="muted small">這是功能配隊練習，不是抽卡模擬器；每個選項代表「某張具有該功能的角色」，沒有真實圖鑑 No. 或卡圖。</p></div><div class="field" style="min-width:190px"><label>想組的典型屬性／體系</label><select id="teamType" onchange="state.teamAttr=this.value;state.deck=['','','','',''];render()">${['純火','純水','純雷','火水','水火','雷水','火雷','水雷','雷火','火光','水光','雷光','火闇','水闇','雷闇','融合','EX-AS'].map(t=>`<option ${state.teamAttr===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="deck-slots">${state.deck.map((v,i)=>`<div class="slot"><div class="pos">${i+1}P</div><select onchange="deckChange(${i},this.value)"><option value="">選擇職能</option>${ROLES.map(r=>`<option value="${r.id}" ${r.id===v?'selected':''}>${r.label}</option>`).join('')}</select><small>${esc(ROLES.find(r=>r.id===v)?.desc||'尚未選擇')}</small></div>`).join('')}</div><div class="sim-actions"><button class="btn" onclick="deckAuto()">套用示範隊</button><button class="btn gold" onclick="deckCheck()">分析配隊</button><button class="btn secondary" onclick="state.deck=['','','','',''];render()">清空</button></div><div id="deckFeedback" style="margin-top:16px"></div><p class="muted small">提示：界王可選「核心＋主力打手＋加 C＋能力值強化＋回復」；DAS 可選「核心＋高連擊＋回復＋加 C＋能力值強化」。融合隊還必須在真實配隊時另外確認五種屬性是否湊齊。</p></div>`}

function hitEnemy(s,id,amount){const e=s.enemies.find(x=>x.id===id&&x.hp>0);if(!e){simLog(s,'本次指定的敵人已經死亡，這次目標判定沒有造成傷害。');return}if(e.layers>0){e.layers--;simLog(s,`攻擊 ${e.name}：消去一層多層屏障，剩 ${e.layers} 層。`);return}const blocked=s.stage===1&&e.id==='mid'&&e.angry&&amount<=30000;if(blocked){simLog(s,`${e.name} 的阻隔傷害使這次 ${amount.toLocaleString()} 點傷害無效。`);return}let actual=Math.min(amount,e.hp);e.hp=Math.max(0,e.hp-actual);simLog(s,`擊中 ${e.name}：-${actual.toLocaleString()} HP${e.hp===0?'，已擊倒。':''}`)}
function playBattle(){let s=state.sim;if(!s||s.ended)return;const oldTurn=s.turn;const dmg3=s.buff>0?40000:20000,dmg2=s.buff>0?5000:3000;simLog(s,`── R${s.stage==='boss'?'BOSS':s.stage} T${oldTurn}：答題正確，Chain +1 ──`);
 if(s.stage===1){for(let i=0;i<5;i++)hitEnemy(s,s.targetHits,dmg2);hitEnemy(s,s.targetStrike,dmg3);const e=s.enemies;if(e[1].hp>0&&e[0].hp===0&&e[2].hp===0&&!e[1].angry){e[1].angry=true;simLog(s,'⚠ 中敵達成怒條件：左右兩敵死亡。怒後先制施加「阻隔傷害 30,000」。')}
 // 左敵回滿存活的我方目標；不復活已死亡敵人
 if(e[0].hp>0){for(const a of e)if(a.hp>0)a.hp=a.max;simLog(s,'左敵存活：回復全體存活敵人 HP 至滿。')}
 let damage=(e[1].hp>0?(e[1].angry?4500:2500):0)+(e[2].hp>0?1500:0);if(damage>0){let taken=Math.round(damage*(s.shield>0?.7:1));s.hp-=taken;simLog(s,`敵方造成 ${taken.toLocaleString()} 傷害（減傷狀態${s.shield>0?'有效':'無效'}）。`)}
 }else{const boss=s.enemies[0];for(let i=0;i<5;i++)hitEnemy(s,'boss',dmg2);hitEnemy(s,'boss',dmg3);if(boss.hp>0&&!boss.angry&&boss.hp<75000){boss.angry=true;s.buff=0;simLog(s,'⚠ Boss HP 低於 50%：怒後先制詛咒，清除 1P 的增傷。')}
 if(boss.hp>0){let base=boss.angry?5000:3500;let taken=Math.round(base*(s.shield>0?.7:1));s.hp-=taken;simLog(s,`Boss 普通行動造成 ${taken} 傷害。`)} }
 // 4P AS heal, illustrative heal after enemy phase to keep simple
 if(s.hp>0){const heal=2250;s.hp=Math.min(s.maxhp,s.hp+heal);simLog(s,'4P 回復 AS：回復至多 2,250 HP（教學簡化處理）。')}s.chain++;if(s.buff>0)s.buff--;if(s.shield>0)s.shield--;
 if(s.hp<=0){s.hp=0;s.ended=true;simLog(s,'✖ 隊伍 HP 歸零。回頭檢查擊殺目標、防禦施放時機。')}
 else if(s.enemies.every(e=>e.hp===0)){if(s.stage===1){s.stage='boss';s.enemies=[{id:'boss',name:'封印魔導書',emoji:'📕',hp:150000,max:150000,layers:0,angry:false}];s.targetHits='boss';s.targetStrike='boss';simLog(s,'✓ R1 完成！進入 Boss 戰。Boss 有技能反射與高 SS 耐性（本模擬不提供攻擊 SS）。');s.turn++}else{s.ended=true;simLog(s,`🎉 教學關卡通關，共 ${oldTurn} 次答題！`)} }
 else s.turn++;
 render();const log=$('simLog');if(log)log.scrollTop=log.scrollHeight;
}

function battleView(){if(!state.sim)state.sim=battleInitial();const s=state.sim;
const opts=s.enemies.filter(e=>e.hp>0).map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
let t2=s.targetHits,t3=s.targetStrike; if(!s.enemies.some(e=>e.id===t2&&e.hp>0))t2=s.enemies.find(e=>e.hp>0)?.id||'boss';if(!s.enemies.some(e=>e.id===t3&&e.hp>0))t3=s.enemies.find(e=>e.hp>0)?.id||'boss';s.targetHits=t2;s.targetStrike=t3;
return `<div class="panel"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><div class="kicker">BATTLE SIMULATOR · 教學簡化模型</div><h2 style="margin:8px 0">被封印的魔導書</h2><p class="muted small">練習：先殺左敵回復術士，用五連擊拆右敵屏障，控制中敵怒；Boss 怒後重新施放增傷。</p></div><button class="btn secondary" onclick="beginBattle()">↺ 重開關卡</button></div><div class="alert">這是<strong>自製教學沙盒</strong>，不是官方戰鬥引擎；僅示範攻擊次數、技能施放時機、怒與阻隔判斷。回復、狀態與傷害結算為方便學習的自定規則，不能據此預測真實關卡。</div><div class="row" style="justify-content:space-between;margin:17px 0;flex-wrap:wrap"><span class="chip">${s.stage==='boss'?'Boss 戰':'R1'} · T${s.turn} · ${s.chain} C</span><span class="chip">我方 HP ${s.hp.toLocaleString()} / ${s.maxhp.toLocaleString()}</span><span class="chip">增傷 ${s.buff>0?'有效 '+s.buff+' 回合':'無'} · 減傷 ${s.shield>0?'有效 '+s.shield+' 回合':'無'}</span></div><div class="sim-enemies">${s.enemies.map(e=>`<div class="enemy ${e.hp<=0?'dead':''}"><div class="emoji">${e.emoji}</div><strong class="small">${e.name}</strong><div class="small muted">HP ${e.hp.toLocaleString()}/${e.max.toLocaleString()}</div><div class="hpbar"><span style="width:${Math.round(e.hp/e.max*100)}%"></span></div><div class="small" style="color:var(--gold)">${e.layers?`多層屏障 ${e.layers}`:e.angry?'怒：阻隔／詛咒':e.hp<=0?'已擊倒':'等待行動'}</div></div>`).join('')}</div><div class="train-grid" style="margin-top:20px"><div class="training-card"><h3>我方技能</h3><p>1P 攻擊強化：提升 2P、3P 的輸出（SS）<br>5P 減傷：減少所受傷害（SS）<br>4P：每次答對自動回復 2,250 HP</p><div class="sim-actions"><button class="btn" onclick="simSkill('buff')" ${s.ended?'disabled':''}>使用 1P 增傷</button><button class="btn" onclick="simSkill('shield')" ${s.ended?'disabled':''}>使用 5P 減傷</button></div><p class="small muted">技能有模擬 CD；如果按太早，戰鬥紀錄會提醒你。</p></div><div class="training-card"><h3>鎖定攻擊目標</h3><div class="field"><label>2P · 五連擊（每下 ${s.buff>0?'5,000':'3,000'}）</label><select onchange="simTarget('targetHits',this.value)" ${s.ended?'disabled':''}>${s.enemies.filter(e=>e.hp>0).map(e=>`<option value="${e.id}" ${s.targetHits===e.id?'selected':''}>${e.name}</option>`).join('')}</select></div><div class="field"><label>3P · 單次高傷害（${(s.buff>0?40000:20000).toLocaleString()}）</label><select onchange="simTarget('targetStrike',this.value)" ${s.ended?'disabled':''}>${s.enemies.filter(e=>e.hp>0).map(e=>`<option value="${e.id}" ${s.targetStrike===e.id?'selected':''}>${e.name}</option>`).join('')}</select></div><button class="btn gold" style="width:100%" onclick="playBattle()" ${s.ended?'disabled':''}>✓ 答對一題 · 執行本回合</button></div></div><div style="margin-top:18px"><div class="row" style="justify-content:space-between"><strong>戰鬥紀錄</strong><span class="muted small">最新訊息在下方</span></div><div class="sim-log" id="simLog">${s.history.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>${s.ended?`<div class="feedback ${s.hp>0?'good':'bad'}"><strong>${s.hp>0?'✓ 成功通關':'✖ 此次失敗'}</strong><p>${s.hp>0?'你已使用鎖定、連擊與增益達成目標。試著不開減傷，或改成全隊打 Boss，觀察為何結果不同。':'可依戰鬥紀錄判斷是哪個敵人持續回血、攻擊被阻隔或防禦時機不足。'}</p><button class="btn gold" onclick="beginBattle()">再試一次</button></div>`:''}</div>`}
function calcView(){return `<div class="panel"><div class="kicker">DAMAGE SANDBOX</div><h2 style="margin:8px 0">AS 效果值／連擊／阻隔計算器</h2><p class="muted small">只模擬一般攻擊型 AS 的簡化公式，固定隨機值為 1；不包含完整主複屬、特效、敵方防禦、技能領域等。</p><div class="train-grid"><div><div class="field"><label>參與計算的攻擊力 ATK</label><input type="number" min="0" value="8000" id="cAtk" oninput="calculate()"></div><div class="field"><label>AS 攻擊效果值 E</label><input type="number" min="0" value="500" id="cEffect" oninput="calculate()"></div><div class="field"><label>目前 Chain</label><input type="number" min="0" value="20" id="cChain" oninput="calculate()"></div></div><div><div class="field"><label>屬性修正</label><select id="cAttr" onchange="calculate()"><option value="1.5">有利（1.5）</option><option value="1">一般（1.0）</option><option value="0.5">不利（0.5）</option></select></div><div class="field"><label>AS 倍率強化</label><select id="cKing" onchange="calculate()"><option value="1">沒有</option><option value="2">2 倍（教學）</option><option value="3">3 倍（教學）</option></select></div><div class="field"><label>攻擊次數（分配總傷害）</label><input type="number" id="cHits" min="1" max="50" value="5" oninput="calculate()"></div><div class="field"><label>敵方每下阻隔門檻</label><input type="number" id="cBlock" min="0" value="1500" oninput="calculate()"></div></div></div><div class="training-card" id="calcResult" style="margin-top:17px"></div><p class="muted small">計算式：ATK÷2 × (100＋E)÷100 × 屬性修正 × (1＋Chain÷100) × AS 倍率；平均分配到連擊次數，單次傷害未超過阻隔門檻時視為被擋。實際各次攻擊可能受取整、敵方防禦和特殊技能影響。</p></div>`}
function calculate(){const num=id=>Math.max(0,Number($(id)?.value)||0);const atk=num('cAtk'),effect=num('cEffect'),chain=num('cChain'),attr=num('cAttr'),king=num('cKing'),hits=Math.max(1,Math.min(50,num('cHits'))),bar=num('cBlock');const total=atk/2*((100+effect)/100)*attr*(1+chain/100)*king,one=total/hits,after=(one>bar?total:0);$('calcResult').innerHTML=`<div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><div class="muted small">簡化 AS 總傷害</div><h2 style="margin:3px 0;color:var(--gold)">${Math.round(total).toLocaleString()}</h2></div><div><div class="muted small">平均單下傷害</div><h2 style="margin:3px 0">${Math.round(one).toLocaleString()}</h2></div><div><div class="muted small">阻隔後估算</div><h2 style="margin:3px 0;color:${after?'var(--accent)':'var(--red)'}">${Math.round(after).toLocaleString()}</h2></div></div><p class="small">${bar>0?(after>0?'單次傷害高於阻隔門檻：簡化模型中可正常造成傷害。':'單次傷害不超過阻隔門檻：即使總傷害很高，仍可能每一下都被擋。'):'未設定阻隔門檻。'}</p>`}

function render(){nav();updateThemeButton();updateFontButton();const content=$('content');if(state.page==='home')content.innerHTML=home();else if(state.page==='chapter')content.innerHTML=chapter();else if(state.page==='search')content.innerHTML=searchPage();else if(state.page==='cards')content.innerHTML=cards();else if(state.page==='training'){content.innerHTML=train();if(state.trainTab==='calc')calculate()}else if(state.page==='glossary')content.innerHTML=glossary();else if(state.page==='links')content.innerHTML=linkHub();else if(state.page==='sources')content.innerHTML=sources();else content.innerHTML=home()}
window.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();state.page='search';render();$('globalSearch')?.focus()}if(e.key==='Escape')closeMenu()});
document.documentElement.dataset.theme=store.get('wiz-theme','light');document.documentElement.dataset.fontsize=store.get('wiz-fontsize','normal');
const hash=decodeURIComponent(location.hash.replace(/^#/,''));if(hash.startsWith('chapter/')){const parts=hash.split('/');state.page='chapter';state.part=Number(parts[1])||1;state.topic=parts[2]||null}else if(['home','search','cards','mine','training','glossary','links','sources'].includes(hash))state.page=hash;
render();
</script>
